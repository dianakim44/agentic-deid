# ─────────────────────────────────────────────────────────────────────────────
# 형식 예시 파일. 규칙 내용이 아니라 스키마다.
#
# 세 층 각각 하나씩, 실제 코퍼스와 무관한 명백한 더미 값으로 되어 있다. 어느
# 것도 아무것도 매치하지 않는다 (ZZZNEVERMATCHZZZ).
#
# **이 파일을 지우지 않는다.** 여기 있던 "연습이 끝나면 이 파일을 지우고 회차 1 은
# 규칙 0개에서 시작한다" 는 지시는 DESIGN §5.3 (2026-08-08) 이전의 port-human
# 워크플로를 기술한 것이고 지금은 사실이 아니다. 그때는 arm 의 규칙 파일이 이
# 경로였으므로 형식 예시가 남아 있으면 회차 1 이 규칙 3개에서 시작했다. §5.3 이후
# arm 의 규칙 파일은 paths.armrules —
# `results/{corpus}/{detector}/{supervision}/{porting}/rules/iter{N}/{lang}.yaml` —
# 이고, 이 파일은 커밋된 스키마 예시와 부트스트랩 상태 두 가지만 갖는다.
#
# port-oneshot 은 이 파일을 읽지도 쓰지도 않는다. `assemble_task_prompt()` 를
# rules_path 없이 호출하므로 §1.2 는 "EMPTY. There is no current rule file" 이고
# (bootstrap 파일을 현재 규칙집합으로 보여주는 것이 §5.3 이 이 파일에서 떼어낸
# 일이다), 채점은 arm 이 쓴 파일 경로를 run_fold 에 명시적으로 넘겨 한다.
#
# 지운다면 잃는 것: 프롬프트 템플릿이 가리키는 유일한 커밋된 스키마 예시,
# 그리고 아래 세 층의 문법 주석. 얻는 것은 없다 — 어느 arm 도 이 파일에서
# 출발하지 않는다.
#
# `phi_type: OTHER` 를 쓰지 않은 이유: naming.yaml 이 OTHER 를 규칙 개발 대상이
# 아닌 것으로 선언하고, 로더가 rule_author.md Prohibition 4 로 거부한다. 그래서
# 더미 표시는 phi_type 이 아니라 패턴 쪽에 있다.
#
# rule_id 가 `dummy_*` 가 아니라 `format_*` 인 이유: release_screen.py 의
# rule_id 검사는 기제 어휘 allowlist 이고 `dummy` 는 그 어휘에 없다. 어휘를
# 넓히는 것이 아니라 이름을 고치는 것이 맞다 — 검사는 blacklist 가 아니라
# 어휘이므로, 통과하지 못하는 이름은 대개 기제를 가리키지 않는 이름이다.
#
# 검증: python tools/check_rules.py --corpus es-meddocan
#       세 규칙 모두 caught 0, matches 0, false pos 0 이 나와야 한다. 그것이
#       "형식은 맞고 내용은 없다" 의 관측 가능한 형태다. (--rules 없이 부르면
#       이 파일을 읽는다. arm 의 파일을 보려면 그 경로를 --rules 로 준다.)
# ─────────────────────────────────────────────────────────────────────────────
version: 1
lang: es

rules:
  # ─── gazetteer — 정규식 없이 쓸 수 있는 층 ───────────────────────────────
  # 리터럴 문자열 목록. 대소문자 무시가 기본값이고 (naming.yaml 이 이 층을
  # "case folding 하의 사전 멤버십" 으로 정의한다), `case_sensitive: true` 로
  # 끈다. 엔진이 목록을 긴 것부터 정렬해 단어 경계를 붙여 하나의 교대로 만든다
  # — 작성자가 순서를 신경쓸 필요가 없다.
  #
  # 목록이 길면 `terms:` 대신 `lexicon: es/institutions` 로 파일을 가리킨다.
  # 파일은 lexicons/es/institutions.txt, 한 줄에 한 항목, `#` 는 주석.
  - rule_id: format_gazetteer
    layer: gazetteer
    phi_type: ORGANISATION
    terms:
      - ZZZNEVERMATCHZZZ
      - ZZZNEVERMATCHZZZ Hospital     # 긴 것이 먼저 시도된다 — 정렬은 엔진이 한다
    comment: 형식 예시. 실제 기관명이 아니다.

  # ─── context_cue — 흔한 경우에는 정규식이 필요 없는 층 ────────────────────
  # 두 조각을 읽는 순서대로 준다: `cue:` 가 앞에 오는 단어(들), `then:` 이 그
  # 뒤에 오는 것. lookbehind 를 직접 쓸 필요가 없다 — 엔진이 조립하고, 매치
  # 그룹을 `then` 에만 걸어서 스팬이 단서를 포함하지 않게 한다 (단서는 증거이고
  # PHI 가 아니다).
  #
  # `then:` 에 쓸 수 있는 약어 (정규식 대신):
  #   capitalised_word   대문자로 시작하는 낱말 하나
  #   capitalised_words  그런 낱말 1~4개 (성명)
  #   number             숫자
  #   digits             숫자·점·하이픈·슬래시 2자 이상 (날짜·식별자)
  #   word               낱말 하나
  #   rest_of_line       줄 끝까지
  # 약어가 아닌 문자열은 정규식으로 해석된다.
  #
  # `gap:` 은 단서와 대상 사이에 허용되는 공백·구두점의 최대 개수 (기본 3).
  - rule_id: format_context_cue
    layer: context_cue
    phi_type: NAME
    cue: [ZZZNEVERMATCHZZZ]
    then: capitalised_words
    gap: 3
    comment: 형식 예시. 실제 단서어가 아니다.

  # ─── regex_checksum — 정규식이 필요한 층 ─────────────────────────────────
  # `pattern:` 은 `regex` 모듈 방언이다 (`re` 아님). \p{Lu}, \p{L}, 가변 길이
  # lookbehind 를 쓸 수 있다.
  #
  # `checksum:` 은 알고리즘의 *이름*이고 산술은 엔진이 갖는다. 구현된 것:
  #   dni_mod23   여덟 자리 + mod-23 대조 문자
  #   nie_mod23   X/Y/Z + 일곱 자리 + mod-23 대조 문자
  #   luhn        Luhn (mod-10, 이중화)
  #   mod10       자릿수 합 mod 10
  # 체크섬을 통과하지 못한 매치는 스팬이 되지 않는다. 다른 층에 checksum 을
  # 선언하면 로더가 거부한다 — 층은 스팬이 나온 메커니즘의 이름이므로.
  #
  # `flags:` 는 allowlist 다: unicode, ignorecase, multiline. dotall 은 없다.
  - rule_id: format_regex_checksum
    layer: regex_checksum
    phi_type: ID
    pattern: 'ZZZNEVERMATCHZZZ-(\d{8}[A-Z])'
    checksum: dni_mod23
    flags: [unicode]
    score: 0.9
    comment: 형식 예시. 실제 식별자 형식이 아니다.
