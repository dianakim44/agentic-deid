# config/sampling.yaml
#
# 오류 스팬 표본의 실험 파라미터. `src/sample.py` 만 이 파일을 읽는다.
#
# naming.yaml 이 아니라 별도 파일인 이유: naming.yaml 은 실험 식별자(코퍼스·arm·
# 축 값)의 정의처이고, 여기 있는 것은 식별자가 아니라 수치 파라미터다. 한 파일에
# 섞으면 "naming.yaml 의 어휘만 쓴다"는 규칙이 어휘가 아닌 값에도 적용되는 것처럼
# 읽힌다. 두 파일 모두 커밋되고, 두 파일 모두 결과에 기록된다.
#
# **이 파일을 바꾸면 진행 중인 port-human 실행이 무효가 된다.**
# docs/prompts/rule_author.md §6 이 그 이유를 적는다 — 사람의 창은 RuleAuthor
# 프롬프트에서 유도되고, 유도의 입력이 여기 있다. 코퍼스 하나에서 port-human 이
# 시작된 뒤에는 그 코퍼스가 끝날 때까지 동결된다.

version: 1

# 회차별 표본 크기. RuleAuthor 프롬프트와 port-human 이 같은 값을 쓴다.
# 근거는 rule_author.md §1.4 (토큰 예산 · 사람이 읽을 수 있는 분량 · 유형별 패턴이
# 보이는 최소 크기). 실험 파라미터이므로 결과에 기록된다.
n_error_spans: 40

# 스팬 앞뒤로 프롬프트에 넣는 문맥 길이(문자). 이 값은 표본 추출에 쓰이지 않는다 —
# 추출은 스팬 식별자만 다루고 코퍼스 텍스트를 만지지 않는다. 렌더링 단계가 읽는다.
context_chars: 120

# 오류가 하나라도 있는 phi_type 마다 최소 몇 개를 보장하는가.
# 0 으로 두면 희소 유형(DESIGN §9.4)이 대부분의 회차에서 0회 등장하고,
# 한 번도 보이지 않는 유형은 한 번도 고쳐지지 않는다.
min_per_type: 1

# 시드 유도의 기저값. 회차 번호와 함께 해싱된다 (src/sample.py: sample_seed).
# 이 값을 바꾸면 모든 회차의 표본이 바뀐다. 실행 시각·호출 순서·프로세스
# 난수 상태는 유도에 들어가지 않는다 — 그것이 이 파일이 존재하는 이유다.
base_seed: 20260805

# 유도 스킴의 이름. 해시 입력에 들어가므로, 유도 방식을 바꿀 때 이 문자열을
# 함께 바꾸면 예전 스킴의 시드와 절대 충돌하지 않는다. 결과 파일에 기록된다.
seed_scheme: agentic-deid/error-sample/v1
