# config/naming.yaml
#
# 실험 식별자의 유일한 정의처. 코드는 이 파일에서만 값을 읽는다.
# 문자열을 하드코딩하지 말 것. 새 값이 필요하면 여기 먼저 추가할 것.
#
# 원칙
#   - 이름은 설정에서 유도된다. 범례를 봐야 아는 이름은 쓰지 않는다.
#   - 서수 금지 (arm1, arm2), 상태어 금지 (best, final, deployed).
#   - 설정이 바뀌면 새 ID를 만든다. 기존 ID의 의미를 바꾸지 않는다.

version: 1

axes:

  # ─── 코퍼스 ────────────────────────────────────────────────
  # {언어코드}-{출처}. 언어는 ISO 639-1.
  corpus:
    ko-surro:      Korean surrogate corpus derived from PhysioNet nursing notes
    es-meddocan:   MEDDOCAN, Spanish synthetic clinical case studies
    de-grascco:    GraSCCo, German synthetic clinical narratives
    es-carmen:     CARMEN-I, authentic Hospital Clinic de Barcelona records; Spanish with within-document Catalan
    en-n2c2:       n2c2 2014 de-identification corpus (optional, portal status unclear)

  # ─── 탐지 구성 ─────────────────────────────────────────────
  # R = rules, T = tagger. 에이전트는 역할 약어를 뒤에 붙인다.
  # 파일 경로에 들어가므로 '+' 대신 '-' 를 쓴다.
  detector:
    R:             rule set only (regex, checksum, context cues, gazetteer)
    T:             learned span tagger only
    RT:            rules + tagger, recall-first union merge
    RT-Arb:        RT with an agent arbitrating disagreeing spans
    RT-Aud:        RT with a leak auditor re-reading the de-identified output
    RT-Arb-Aud:    RT with both

  # ─── 탐지 층 (detector 축과 다른 개념) ──────────────────────
  # detector 는 "어떤 구성을 실험으로 돌리는가" — arm 하나가 결과 경로 한 칸이 된다.
  # layer 는 "그 실행 안에서 이 스팬을 실제로 만들어낸 기제는 무엇인가" — 스팬 하나에
  # 붙는 provenance 값이다. 경로에 들어가지 않는다. 하나의 detector arm 이 여러
  # layer 를 포함한다: R 은 regex_checksum·context_cue·gazetteer 를, RT 는 넷 전부를.
  #
  # 층을 따로 두는 이유는 DESIGN.md §7 의 예측이 층 단위로만 반증가능하기 때문이다.
  # 정서법 단서의 실현도가 떨어질 때 손실은 context_cue 에 집중되고 regex_checksum·
  # gazetteer 는 거의 움직이지 않아야 한다. detector 축의 R/T 2분법으로는 이 귀속이
  # 불가능하다. 값은 탐지기 이름에서 유도하지 않고 이 목록에서 읽는다.
  layer:
    regex_checksum: pattern and check-digit validation; depends on structural form, not orthography
    context_cue:    role-word context windows; depends on the orthography around the trigger
    gazetteer:      dictionary membership under case folding; orthography-independent
    tagger:         learned span tagger; uses orthography among many features

  # ─── 표준 PHI 유형 ─────────────────────────────────────────
  # 스팬에 붙는 값이므로 여기 정의한다. 근거와 코퍼스별 매핑 표는 DESIGN.md §9.0.
  #
  # 코퍼스 원본 유형은 이 축의 값이 아니다. 원본 유형은 스팬의 subtype 에
  # 그대로 보존되고 (DESIGN.md §9.0), 코퍼스별 매핑은 mappings/{corpus}.yaml 에
  # 있다. 축을 하나로 두는 이유는 교차 코퍼스 채점이 이 10개 값에서만
  # 이뤄져야 하기 때문이다.
  #
  # §9.1 에서 제외한 유형(SEXO_*, FAMILIARES_*, NAME_TITLE)은 여기에 값이 없다.
  # 제외는 유형이 아니라 스팬의 excluded 표시이고, 스팬 자체는 버리지 않는다 —
  # 제외량을 보고해야 한다. 그 세 유형의 이름과 설명은 이 축이 아니라
  # 아래 excluded_types 블록에 있다 (Auditor 프롬프트가 읽는다).
  phi_type:
    NAME:            person names; role (patient/clinician/relative) stays in subtype
    DATE:            dates, including dates of birth
    AGE:             ages
    LOCATION_AREA:   place names and postcodes, merged per DESIGN §9.2
    LOCATION_STREET: street addresses
    ORGANISATION:    hospitals, health centres, other institutions
    CONTACT:         email, phone, fax
    ID:              record, insurance, licence and employment identifiers
    PROFESSION:      occupations
    OTHER:           residual bucket shipped by a corpus; not a rule-development target

  # ─── 감독 방식 ─────────────────────────────────────────────
  supervision:
    sup-free:      labels recovered from placeholder positions, no manual annotation
    sup-human:     labels from the corpus's own human annotations

  # ─── 이식(porting) 주체 ────────────────────────────────────
  # porting = 고정된 파이프라인이 요구하는 언어별 인스턴스
  #           (rules, gazetteers, encoder)를 만들어내는 작업
  #
  # 축의 순서가 곧 자율성의 정도:
  #   oneshot < loop < multi < selfdesign
  # port-multi 는 역할 구성이 고정, port-selfdesign 은 역할 구성까지 에이전트가 정함.
  # 두 arm 의 차이가 "역할 설계를 위임해도 되는가"에 대한 답이 된다.
  #
  # 기준선은 port-oneshot 이다 (DESIGN §4). 2026-08-07 이전에는 port-human 이었다.
  #
  # port-human 은 **철회되었으나 이 축에서 지우지 않는다.** 세 가지 이유:
  #   1. results/{corpus}/{detector}/{supervision}/port-human/window_freeze.json 이
  #      이미 존재한다. 축에서 지우면 scorer 의 metrics_path() 가 그 경로를
  #      "아무것도 정의하지 않는 경로"로 거부하고, 실재하는 산출물이 이름 없는
  #      디렉토리가 된다. 결과를 지우는 것으로 문서를 고칠 수는 없다.
  #   2. 이 파일 머리의 원칙 — "설정이 바뀌면 새 ID를 만든다. 기존 ID의 의미를
  #      바꾸지 않는다" — 의 이면이다. 지웠다가 나중에 사람 arm 을 되살리면
  #      같은 이름이 재등장하고, 그때 이 이름이 가리키는 것이 철회 전 규약인지
  #      되살린 뒤 규약인지 경로만 봐서는 알 수 없다.
  #   3. 철회는 결과가 아니라 자원 문제였다 (DESIGN §11 머리, §4.1). 축에서
  #      사라진 arm 은 "시도했으나 실패한 arm" 과 구별되지 않는다.
  #
  # retired 표시는 gloss 안의 문자열이고 별도 스키마가 아니다. 축 멤버십은
  # 그대로이므로 코드 경로는 아무것도 바뀌지 않는다 — 의도한 바다. 이 값으로
  # 새 결과를 쓰는 것을 막는 것은 코드가 아니라 DESIGN §11 의 철회 표시다.
  # 축에서 프로그램적으로 막으면 1번 이유와 충돌한다 (같은 멤버십이 기존 경로를
  # 읽는 것과 새 경로를 쓰는 것 둘 다를 관장한다).
  # ─── 같은 rung, 다른 프롬프트 ───────────────────────────────
  # port-oneshot 이 2026-08-11 형식 실패로 끝났고 (docs/notes/arm-port-oneshot-es.md),
  # rule_author.md §2 가 코드 펜스 금지를 명시하도록 고쳐졌다. 고친 프롬프트로
  # 도는 실행은 **새 값**을 받는다. 이유는 셋이다.
  #
  #   1. 첫 실행의 셀은 영구히 소진됐다. called_where() 가 log 를 돌려주고
  #      git 이력에도 산출물이 있으므로 run_arm 은 그 경로를 거부한다 (DESIGN §6.3).
  #      기록을 필드로만 구분하는 방안은 구현 불가다 — 쓸 수 있는 두 번째 실행이
  #      애초에 없다.
  #   2. **재시도가 아니다.** DESIGN §10 A2 가 형식 재시도를 0 으로 사전 등록했고,
  #      형식 실패는 사고가 아니라 보고되는 결과다. 그래서 이름은 시도 횟수가
  #      아니라 **프롬프트의 성질**을 가리킨다. 서수 접미사(-r2, -p2)는 이 축에서
  #      금지이기도 하고 (파일 머리), 바로 A2 가 배제한 독법이기도 하다.
  #   3. 다섯 번째 경로 축을 두는 방안은 기각됐다. 기존 산출물이 4단 경로에
  #      커밋돼 있어 필수 성분을 하나 더하면 ALLOW_PATTERNS 와 metrics_path() 에서
  #      고아가 된다. 옮기는 것도 불가다 — 옮긴 동결 기록은 5단 경로에 있으면서
  #      내용은 네 축만 이름하고, 맞추려 기록을 고치는 것이 §6.3 이 금지하는 바다.
  #
  # 규약: {rung}-{프롬프트가 이제 명시하는 것}. port-loop 도 물려받는다 — 그 arm 이
  # 호출한 뒤 해시되는 창 파일이 움직이면 같은 형태로 새 값을 만든다.
  # 자율성 사다리의 rung 은 그대로 넷이다. 이 값은 새 rung 이 아니라 같은 rung 의
  # 다른 프롬프트이고, 어느 값이 기준선인지는 DESIGN §4 가 정한다.
  porting:
    port-oneshot: |
      a single LLM call writes them, no iteration (DESIGN §4). On es-meddocan this
      value's one call ended in a format failure under the pre-2026-08-11 prompt:
      the cell is spent and no further run can be written to it.
    port-oneshot-nofence: |
      the same rung under the revised prompt, whose §2 states that the emission is
      the file's content alone with no code fence. Not a retry of port-oneshot —
      format retries are zero (DESIGN §10 A2) — but a second run of a different
      prompt, which is what the separate path records.
    port-loop:     RuleAuthor <-> Auditor iterate against dev
    port-multi:    port-loop plus Profiler, Mapper, LexiconBuilder
    port-selfdesign: |
      the agent inspects the corpus profile and proposes its own role set
      before executing it; the roles are not fixed in advance
    port-human: |
      RETIRED 2026-08-07 — a person writes the rules and gazetteers.
      Withdrawn before iteration 1 for want of a human author, not for any
      result. The protocol is retained in full in DESIGN §11 and this value is
      retained here because window_freeze.json already lives at its path.
      Do not write new results under this value without reviving the arm.

  # ─── port-human 회차에서 언어모델을 어디에 썼는가 ──────────
  # rule_author.md §8 의 자기보고. human_log.jsonl 의 모든 행에 들어간다.
  # port-human 과 함께 휴면 상태다 (위 참조). 축은 유지한다 — 되살린 arm 이
  # 이 4값을 다시 논증해야 한다면 §8 의 사전 등록을 잃는 것이다.
  #
  # 불리언이 아니라 4값인 이유: 표본 렌더링에 모델을 쓴 저자는 불리언 질문에
  # 정직하게 false 라고 답하고 (§8.1 이 허용한다), 그러면 이 필드가 구분하려던
  # 유일한 경우를 더 이상 구분하지 못한다. 허용되는 용도를 이름으로 열거해야
  # rule_content 가 판단이 아니라 의도적 기입이 된다.
  #
  # rule_content 는 하네스가 거부하는 오류가 아니라 이 필드가 담을 수 있는 값이다.
  # 잡으려던 답을 거부하는 자기보고 필드는 나머지 답만 모으고, 그러면 arm 의
  # 무결성이 부재를 기록할 수 없는 파일로 증명된다. 애매하면 rule_content 다.
  model_consulted:
    none:         no model was involved in this event
    mechanical:   a model performed an allowed mechanical step (render, count, reduce, validate, log)
    notation:     a model was asked about regex or language notation, not about the corpus
    rule_content: a violation of rule_author.md §8, or the author is unsure whether a question crossed the line

  # ─── 규칙 파일의 언어 ──────────────────────────────────────
  # {lang} 은 **규칙 파일의 언어**다. 코퍼스의 언어가 아니다.
  #
  # 이 구분이 필요한 이유: CARMEN-I 는 2000 문서 중 264(13.2%)가 문서 내부에서
  # 스페인어와 카탈루냐어를 섞는다. 코퍼스 하나에 언어 하나를 배정하는 방식으로는
  # {lang} 에 넣을 올바른 값이 존재하지 않는다. es 는 13.2% 에 대해 틀리고
  # 'es+cat' 은 언어 코드가 아니다. 그래서 {lang} 의 정의를 파일 쪽으로 옮기고,
  # 코퍼스가 어떤 파일들을 로드하는지는 아래 corpus_rule_langs 가 정한다.
  # 근거는 DESIGN.md §5.2.
  lang:
    es:            Spanish rule file
    cat:           Catalan rule file
    de:            German rule file
    ko:            Korean rule file
    en:            English rule file

  # ─── 분할 ──────────────────────────────────────────────────
  split:
    train:         tagger training
    dev:           rule development, agent iteration, checkpoint selection
    test:          sealed. see CLAUDE.md

# ─── 모델 식별자의 "적용 안 됨" 값 ──────────────────────────
# metrics.json 의 run 블록은 model_id 를 요구한다 (DESIGN §4). Bedrock 의 모델
# 별칭은 조용히 갱신되므로 호출 시점의 정확한 식별자를 적어야 하고, 기록 없는
# 실행은 6개월 뒤 재현되지 않는다.
#
# **model_id 는 축이 아니다.** 축으로 두면 닫힌 어휘가 되고, 그러면 실제 Bedrock
# 식별자가 검증에서 거부된다 — model_id 는 통제된 어휘가 아니라 호출 시점의
# 관측값이다. 결과 경로에도 들어가지 않는다 (경로는 arm 을 가리키고, 같은 arm 을
# 두 모델로 돌리는 것은 §10 A2 의 부차 분석이지 새 칸이 아니다).
#
# 그러나 "모델을 쓰지 않는 arm" 의 값 하나는 어휘다. R arm 은 언어모델을
# 호출하지 않고, 그 사실을 적어야 한다. 값이 여기 있는 이유는 CLAUDE.md 의
# 규칙 그대로다 — 결과 파일에 들어가는 값은 코드에 하드코딩하지 않는다.
#
# null 이 아니라 문자열인 이유는 cost 블록의 0 과 같다. null 은 "모르겠다" 와
# "적용 안 됨" 을 구분하지 못하고, 그 둘을 구분하는 것이 이 필드의 용도다.
# 누락은 거부되고, 명시적 부재는 허용된다.
model_id_absent: none

# ─── model_id 가 얼마나 해소되었는가 ────────────────────────
# 2026-08-08 측정: converse 응답은 구체 모델을 노출하지 않는다. 기본 응답에는 모델
# 필드가 아예 없고, additionalModelResponseFieldPaths=["/model"] 로 요청하면 나오지만
# 그 값은 **요청한 것보다 구체적이지 않다** — 날짜 있는 id 를 보내면 날짜가 보존되고,
# 무날짜 별칭을 보내면 무날짜로 돌아온다. GetInferenceProfile 도 무날짜 id 로만
# 풀린다. 전체 측정은 docs/notes/baseline-model-family.md 에 있다.
#
# 그래서 model_id 하나로는 "이 숫자가 어느 가중치에서 나왔는가" 에 답할 수 없고,
# 답할 수 없다는 사실 자체를 기록해야 한다. 6개월 뒤 다른 숫자가 나왔을 때
# 모델이 바뀐 것인지 코드가 바뀐 것인지 구분하려면, 그 때 기록이 "별칭을 적었다" 와
# "모델을 적었다" 중 무엇이었는지 말해줘야 한다.
#
# **이것은 축이 아니다.** model_id 와 같은 이유로 경로에 들어가지 않는다. 그러나
# model_id 와 달리 닫힌 어휘다 — 관측값이 아니라 관측의 *종류*이고, 종류는 세 개다.
# 새 종류가 필요하면 (Bedrock 이 스냅샷 id 를 노출하기 시작하는 경우 등) 코드에
# 문자열을 넣지 않고 여기에 먼저 추가한다.
model_id_resolution:
  dated:             요청 id 가 스냅샷 날짜를 담고 응답이 그것을 확인했다. 재현 가능성이 가장 높은 상태
  alias-unresolved:  요청 id 에 날짜가 없고 응답도 더 주지 않았다. 별칭만 기록되므로 같은 별칭이 다른 모델을 가리켜도 알 수 없다
  mismatch:          응답이 요청과 다른 모델을 보고했다. 호출이 성공했어도 어느 모델이 답했는지 알 수 없으므로 클라이언트가 거부한다

# ─── 반복 종료 사유 ─────────────────────────────────────────
# metrics.json 의 termination 블록에 들어가는 값. DESIGN §3 의 종료 규칙이
# 이 세 결말을 구분하고, 구분 자체가 규정의 요점이다 — "상한에서 멈춘 실행을
# 수렴이라 부르지 않는다" (§3). 상한으로 끝난 실행은 수렴 검사를 만족하지
# **못한** 것이고, 누출률이 아직 떨어지는 중에 8회에서 멈춘 실행은 5회에서
# 수렴한 실행과 다른 주장이다.
#
# **축이 아니다.** 경로에 들어가지 않고 (arm 을 가리키는 것이 아니라 그 arm 이
# 어떻게 끝났는지를 가리킨다) model_id_resolution 과 같은 층위다 — 관측값이
# 아니라 관측의 *종류*이고, 종류는 세 개다. 닫힌 어휘이므로 여기 있다.
#
# not_applicable 이 null 이 아닌 이유는 cost 블록의 0 과 model_id_absent 의
# 'none' 과 같다. R arm 은 반복하지 않으므로 종료 사유를 갖지 않지만, 그
# 사실을 적어야 한다 — null 은 "반복하지 않는 arm" 과 "기록하지 않았다" 를
# 구분하지 못하고, 그 구분이 이 필드의 용도다.
#
# 'converged' 를 코드가 상한 분기에서 쓸 수 없어야 한다. 그 강제는 어휘가
# 아니라 src/termination.py 의 일이다 — 어휘는 두 값을 구분해 줄 뿐이고,
# 어느 값이 어느 분기에 붙는지는 함수 하나가 정한다.
termination_reason:
  converged:      k회 연속으로 dev 누출률 개선이 δ 미만이었다. §3 의 수렴 검사를 만족한 유일한 결말
  ceiling:        반복 상한에 도달했다. 수렴 검사를 만족하지 못했고, 수렴이라 부르지 않는다 (§3)
  not_applicable: 반복하지 않는 arm. 종료 규칙의 적용 대상이 아니다 (R · port-oneshot 계열)

# ─── 종료 규칙의 파라미터 ───────────────────────────────────
# DESIGN §3 에 사전 등록된 값. 2026-08-12, port-loop 의 첫 호출 전.
#
# **sampling.yaml 이 아니라 여기 있는 이유.** sampling.yaml 은 표본 추출의
# 수치 파라미터이고 src/sample.py 만 읽는다. 이 셋은 표본이 아니라 arm 이
# 몇 회 도는지를 정하고, 값이 metrics.json 에 기록된다. 두 파일 모두 커밋되고
# 두 파일 모두 결과에 기록되므로 감사 가능성은 같지만, 종료 규칙을 표본 설정
# 안에 두면 "표본 크기를 바꾼다" 는 편집이 종료 조건을 함께 움직인다.
#
# **δ 는 여기 없다. 여기 있는 것은 δ 를 계산하는 두 상수다** — δ 자체는
# 코퍼스마다 다르고 (`max(delta_floor, delta_spans/n_dev)`), n_dev 는
# splits/{corpus}.json 에서 읽는다. δ 를 값으로 적으면 그것이 어느 코퍼스의
# δ 인지 말하지 않는 숫자가 되고, §3 이 막으려는 것이 정확히 그것이다.
#
# delta_spans = 26 은 독립적인 양이 아니다. `0.005 × 5254` 이고, 곧
# es-meddocan 의 dev fold 가 이 공식의 기준 fold 로 박혀 있다. DESIGN §3 이
# 그 사실을 논거로 적는다 — 다른 기준 fold 였다면 26 이 아니었다.
#
# 이 셋을 실행 후에 손으로 고치면 rung 들이 비교 불가능해진다 (§3, §4).
termination:
  # 개선 불변량: 한 회차가 "생산적" 이려면 몇 개의 gold 가 움직여야 하는가.
  # 비율이 아니라 개수인 것이 요점이다 (§3: "26 spans is the invariant;
  # the rate is the derived value").
  delta_spans: 26
  # δ 의 하한. n_dev 가 5,200 을 넘으면 이 분기가 binding 이다. 노이즈 floor
  # 논거 아래로는 더 작은 거리를 정당화할 근거가 없다 (§3).
  delta_floor: 0.005
  # 연속 몇 회차가 δ 미만이어야 수렴인가. 1 이면 "연속" 이 아무 의미도 없고,
  # 표본 draw 하나의 분산이 수렴으로 읽힌다 (§3).
  k: 2
  # 반복 상한. 코퍼스와 무관하다 — 비용에서 유도되고, 회차당 비용은 gold
  # 개수의 함수가 아니다 (§3).
  ceiling: 8

# ─── 호출한 에이전트 역할 ───────────────────────────────────
# agent_calls.jsonl 각 행의 role 필드. DESIGN §5.5 — RuleAuthor 와 Auditor 가
# 둘 다 모델을 호출하고 둘의 행이 한 로그에 섞이므로, llm_calls 는 둘을 합쳐
# 센다. 비용으로는 그게 맞고 (한 회차가 쓴 총액이다) 귀속으로는 쓸 수 없다 —
# 행이 어느 에이전트의 것인지 말하지 않으면 "Auditor 가 비용의 절반을 쓴다"
# 같은 문장을 확인할 방법이 없다.
#
# **축이 아니다.** termination_reason·model_id_resolution 과 같은 층위이고,
# 경로에 들어가지 않는다. 그럼에도 여기 있는 이유는 CLAUDE.md 의 규칙이
# 결과 경로에 들어가지 않는 값도 포함하기 때문이다.
#
# 값 이름이 프롬프트 파일 이름과 같다 (docs/prompts/rule_author.md ·
# auditor.md). 우연이 아니라 그 대응이 §3 의 "에이전트는 자기가 만드는 파일로
# 정의된다" 를 로그 층에서 확인 가능하게 하기 때문이다. 다만 코드가 파일
# 이름에서 role 을 **유도하지 않는다** — layer 를 탐지기 이름에서 유도하지
# 않는 것과 같은 이유로, 호출하는 쪽이 직접 적는다.
#
# port-oneshot 계열의 기존 행은 다시 쓰지 않는다 (§5.5). 그 행들은 role 필드가
# 없던 시점의 기록이고, 나중에 채워 넣은 값은 그 호출에 대한 진술이 아니다.
#
# 아래 셋은 port-multi 가 추가하는 루프 **밖** 에이전트다 (DESIGN §6.7.1).
# 호출 순서는 profiler → mapper → lexicon_builder 이고 회차 1 보다 앞이다.
# 로그에서 그 사실이 검사 가능하도록 세 역할은 iteration 0 에만 쓰고,
# rule_author·auditor 는 iteration 0 에 쓰지 않는다 — orchestrate.call_line 이
# 거부한다. "루프 밖" 이 드라이버를 믿어야 아는 사실이 아니라 커밋된 로그에서
# 읽히는 사실이 되는 것이 그 규칙의 목적이다.
agent_role:
  rule_author: rules/{lang}.yaml 을 쓰는 에이전트. 모든 porting arm 이 최소 한 번 호출한다
  auditor:     마스킹된 dev 텍스트를 읽고 잔존 PHI 를 의심 표시한다. port-loop 회차 2 이상에서만 호출된다
  profiler:    profile.json 을 쓴다 (paths.armprofile). 루프 밖 첫 호출. 로더의 인코딩·오프셋 규약을 정한다
  mapper:      mapping.yaml 을 쓴다 (paths.armmapping). 루프 밖 둘째 호출. profile.type_inventory 를 읽는다
  lexicon_builder: lexicons/{lang}/ 을 쓴다 (paths.armlexicon). 루프 밖 셋째 호출. 세 산출물 중 유일하게 탐지에 들어간다

# ─── 프롬프트 캐시 경계 ─────────────────────────────────────
# metrics.json 의 caching.boundary 에 들어가는 값. **경계는 프롬프트의 어느
# 블록까지가 캐시되는 쪽인지를 말한다** — 캐시된 바이트가 무엇인지에 대한
# 진술이고, 얼마나 절약됐는지에 대한 진술이 아니다 (그건 read_tokens ·
# write_tokens 다).
#
# 2026-08-16 측정으로 캐싱이 가능함이 확인됐고 (docs/notes/baseline-model-family.md),
# DESIGN §5.4 · docs/prompts/auditor.md §6 세 번째 불릿이 경계를 선언한다.
#
# **경계가 어휘인 이유.** 캐시된 쪽에 무엇이 들어가는지가 DUA 문제다.
# auditor.md §6 은 "템플릿·입력 배너·§1.1 프레임이 캐시되는 쪽이고
# **마스킹된 문서는 경계 저쪽이며 절대 캐시되지 않는다**" 고 적는다. 그 문장이
# 검사 가능한 것은 경계가 이름을 가진 값이기 때문이다 — 코드가 자유 문자열을
# 쓸 수 있으면 "after_frame" 과 "after_the_frame" 이 같은 파일에 섞이고,
# 어느 arm 이 무엇을 캐시했는지 묶을 수 없다. 부재("캐싱 안 씀")는 값이
# 아니라 블록 자체의 부재로 적는다 — model_id_absent 와 다른 규약인데,
# 그 필드는 항상 쓰이는 run 블록 안에 있고 이건 블록 하나가 통째로 옵션이다.
#
# **축이 아니다.** agent_role·audit_refusal 과 같은 층위다. 경로에 들어가지
# 않고 metrics.json 의 내용에 들어간다.
#
# 값이 하나다. 그것이 요점이다 — 경계를 옮기는 것은 여기 값을 추가하는
# 편집이고, auditor.md §6 이 선언한 경계를 넘기려면 그 불릿을 먼저 고쳐야
# 한다. 마스킹된 문서를 캐시 쪽으로 넘기는 값은 이 목록에 없고, 있어서도 안 된다.
caching_boundary:
  after_audit_frame: auditor.md 템플릿 전문 · 입력 배너 · §1.1 프레임까지가 캐시되는 쪽이다. §1.2 마스킹된 문서는 경계 저쪽이고 캐시되지 않는다

# ─── 프롬프트 캐시 TTL ──────────────────────────────────────
# metrics.json 의 caching.ttl. Bedrock 이 cacheDetails 에 돌려주는 값과 같은
# 문자열이고, 그것이 이 어휘가 닫혀 있는 이유다 — 서비스가 발행하는 값과
# 우리가 적는 값이 같아야 교차 확인이 된다.
#
# **5m 인 근거는 회차 구조다** (2026-08-16 측정). 회차 안에서 Auditor 는 dev
# 문서당 한 번, 250 회를 순차로 호출하고 호출 간격은 초 단위다 (측정된 write→read
# 간격 1.6s). 회차 사이 공백은 40–80분이라 5분 TTL 을 넘긴다. 그래서
# **회차당 write 1회 + read N−1회** 가 맞는 모델이고, 더 긴 TTL 을 살 이유가
# 없다 — 회차 간에 살아남을 필요가 없고, 살아남아도 다음 회차의 접두부는
# 같은 바이트이므로 얻는 것이 없다.
caching_ttl:
  5m: 5분. 회차 내 호출 간격은 초 단위이고 회차 간 공백은 40–80분이므로, 회차당 write 1회 모델이 성립한다

# ─── Auditor 표시가 거부되는 사유 ───────────────────────────
# audit_report.json 의 refused 목록과 counts.refused 에 들어가는 값.
# docs/prompts/auditor.md §2.3 이 이 다섯을 표로 적고, validator 가 이 어휘로만
# 거부한다.
#
# **거부하고 고치지 않는다.** 범위를 벗어난 열 번호를 줄 끝으로 당기면
# 에이전트가 주장하지 않은 위치의 표시가 생기고, 파일에는 그런 일이 있었다는
# 기록이 없다. 조용히 버리면 보고서가 짧아지는데 그 이유를 읽는 쪽에서 볼
# 방법이 없다. 그래서 사유와 함께 남기고 총계를 센다 — 한 회차에서 모델이
# 좌표 규약을 놓친 것이 얇은 보고서가 아니라 숫자로 보여야 한다.
#
# **축이 아니다.** agent_role·termination_reason 과 같은 층위다. 다만 이쪽은
# 경로가 아니라 results/ 아래 파일의 *내용*에 들어가고, CLAUDE.md 의 규칙은
# 결과 경로에 들어가지 않는 값도 포함한다.
#
# 어휘가 코드보다 먼저 있다. 사양이 코드보다 앞서 있는 상태를 오래 두지
# 않는다는 것이 이 블록과 validator 가 같은 커밋에 있는 이유다 — 프롬프트가
# 약속한 거부 사유가 코드에 없으면, 그 사이에 들어온 표시는 검사받지 않는다.
#
# 표면형은 어느 사유에도 붙지 않는다. 거부된 표시는 doc_id 와 사유만 남기고
# 위치조차 남기지 않는다 — 거부의 절반은 위치가 신뢰할 수 없다는 판단이고,
# 신뢰할 수 없는 위치를 기록하면 그것이 잔존 식별자의 지도인 척한다.
audit_refusal:
  out_of_range:        줄 번호나 열이 보낸 문서의 끝을 넘었다. 좌표 규약을 놓친 신호다
  inside_a_mask_tag:   이미 탐지된 스팬(마스크 태그)과 겹친다. 자기 탐지기에게 탐지 결과를 되돌려주는 표시다
  undeclared_phi_type: phi_type 축에 없는 값이다. OTHER 도 여기에 해당한다 (규칙을 쓸 수 없는 유형)
  crosses_a_line:      end 가 start 보다 앞이거나 그 줄이 담을 수 없는 길이다. 표시는 줄을 넘지 않는다
  malformed:           JSON 객체 하나가 아니거나, 모르는 필드가 있거나, 필수 필드가 없거나, score 가 [0,1] 밖이다

# ═══ port-multi 의 세 산출물 어휘 ═══════════════════════════
# 아래 블록들은 profiler·mapper·lexicon_builder 가 만드는 파일의 *내용*에
# 들어가는 값이다. audit_refusal 과 같은 층위다 — 축이 아니고, 결과 경로에
# 들어가지 않고, results/ 아래 파일에 들어간다. CLAUDE.md 의 규칙은 그런 값도
# 포함한다.
#
# 세 프롬프트가 각각 "구현 커밋이 이 파일에 추가한다" 고 약속했고, 이 커밋이
# 그것이다 (docs/prompts/profiler.md §2.1, mapper.md §2.1, lexicon_builder.md §2.1).
# 어휘가 validator 안에서 발명되지 않는 것이 요점이다 — 발명되면 프롬프트가
# 약속한 닫힌 집합과 코드가 검사하는 집합이 두 답이 되고, 어느 쪽이 낡았는지
# 보이지 않는다.
#
# **약속된 일곱 중 둘은 목록이 아니다.** mapping_unresolved 와
# lexicon_unresolved 는 값을 갖지 않는다. 각 블록에 그 이유를 적었다. 값이
# 없는 어휘를 만들면 아무도 쓰지 않는 목록이 남고, 그것은 이 규칙이 막으려던
# 두 번째 답이다.

# ─── Profiler: 로드 규약 필드 아홉 ──────────────────────────
# profile.json 의 아홉 필드가 각각 이 어휘 하나에서 값을 받는다
# (docs/prompts/profiler.md §2.1). 나머지 두 필드는 어휘가 없다 —
# type_inventory 는 코퍼스 자신의 라벨 목록이고 patient_key_available 은
# 불리언이다. 그래서 스키마는 11 필드이고 어휘는 9 개다.
#
# **이 아홉은 로더가 실제로 하는 일의 목록이다.** 값을 늘리는 것은
# src/corpora/ 가 그 값을 실행할 수 있게 만드는 것과 같은 일이다 — 로더가
# 처리하지 못하는 규약을 여기 넣으면, 에이전트가 그것을 고르고 arm 은 로드
# 시점에 죽는다. 그 죽음은 정직하지만 (profiler.md §4: 틀린 프로필은 오프셋
# 불일치 수와 함께 멈춘다) 예방 가능한 것이었다.
annotation_encoding:
  brat_standoff:  .ann 파일이 T 행으로 오프셋을 담고 텍스트는 별도 .txt 에 있다 (MEDDOCAN)
  inline_xml:     주석이 텍스트 안 태그로 들어가 있어 표면형과 라벨이 한 파일에 있다
  csv_offsets:    행 단위 표에 문서 id·오프셋·유형이 들어 있다
  json_spans:     문서마다 JSON 객체 하나가 스팬 목록을 담는다

text_location:
  separate_file:  주석과 원문이 다른 파일이다. 오프셋은 원문 파일 기준이다
  same_file:      한 파일이 원문과 주석을 함께 담는다. 오프셋 기준이 태그 제거 전인지 후인지가 별개 질문이 된다

offset_unit:
  character:       파이썬 str 인덱스와 같은 단위 (코드포인트). 로더가 슬라이스하는 단위다
  byte:            UTF-8 바이트 오프셋. 로더가 디코드 전에 변환해야 한다
  utf16_code_unit: UTF-16 코드 유닛. BMP 밖 문자에서 character 와 갈린다

offset_base:
  zero: 첫 문자가 0
  one:  첫 문자가 1

offset_end:
  exclusive: end 가 스팬에 포함되지 않는다 (파이썬 슬라이스)
  inclusive: end 가 마지막 문자를 가리킨다. 길이가 end - start + 1 이다

newline:
  lf_only:   \n 만 나온다
  crlf_only: \r\n 만 나온다. 오프셋이 \r 을 세는지가 별개 질문이다
  mixed:     한 코퍼스 안에 두 형태가 섞여 있다

# DESIGN §9.7 의 그 필드다. 32 개 BOM 파일에서 오프셋이 BOM 을 한 문자로
# 세는지 아닌지가 761 스팬의 정합을 가른다. stripped 를 고르면 arm 은 utf-8-sig
# 로 열고 그 761 개가 전부 어긋난다 — 조용히 나빠지지 않고 로드에서 멈춘다.
bom:
  absent:                    BOM 이 없다
  counted_as_one_character:  BOM 이 있고 오프셋이 그것을 한 문자로 센다 (MEDDOCAN 의 실측)
  stripped:                  BOM 이 있고 오프셋은 그것을 세지 않는다. 디코드 시점에 제거해야 한다

# **두 값의 표기는 프롬프트와 인벤토리 스크립트가 이미 정한 것이다.**
# mapper.md §1.1 이 "(flat or two_level)" 이라고 적고, 인벤토리의
# annotation_format.type_system_depth 가 "brat is FLAT ...; xml is TWO-LEVEL"
# 이라고 적고, 집계 키 자체가 phi_types_brat_flat / phi_types_xml_two_level 이다.
# 여기서 hierarchical 같은 다른 단어를 쓰면 에이전트가 프롬프트에서 읽은 값이
# 어휘 밖이 되어 undeclared_value 로 거부된다 — 어휘를 코드가 아니라 config 에
# 두는 규칙이 막으려는 것이 정확히 그 두 답이다.
type_system_level:
  flat:      유형이 단일 층이다. 상위·하위 관계가 없다
  two_level: 거친 층과 세밀한 층이 둘 다 있어 어느 층에서 매핑할지가 결정 사항이 된다 (MEDDOCAN 의 XML)

# **얼린 분할이 있는 코퍼스에서 이 필드는 비교되고 적용되지 않는다**
# (profiler.md §4, DESIGN §6.7.1: 11 필드 중 죽은 두 개의 하나). 값을 바꾸면
# 코퍼스가 다시 나뉘고 그것이 test fold 봉인을 여는 것이다.
group_key:
  document_id_stem: 문서 id 의 어간이 그룹이다 (DESIGN §9.5 의 stem parse)
  patient_id:       환자 키가 있고 그것이 그룹이다. 가장 강한 자연 그룹
  filename:         파일명이 그룹이다. 문서 하나가 곧 그룹인 경우
  none:             그룹이 없다. 레코드 단위 분할이 되는데 CLAUDE.md 가 금지한다

# profile.json 의 unresolved 리스트에 들어갈 수 있는 이름. 스키마 11 필드
# 그대로다 — 값을 못 정했다고 말할 수 있는 필드가 곧 값을 갖는 필드이기
# 때문이다. cites 와 unresolved 자신은 필드가 아니라 메타이고 목록에 없다.
#
# **여기 있는 이유는 이 목록이 두 곳에 있으면 안 되기 때문이다.** validator 는
# 스키마 검사와 unresolved 검사를 같은 목록으로 한다. 스키마를 코드에 두고
# 이것만 여기 두면 필드 추가가 두 편집이 되고, 한쪽을 잊으면 새 필드는
# "모른다" 고 말할 수 없는 필드가 된다.
profile_unresolved:
  annotation_encoding:   §2.1 스키마 필드
  text_location:         §2.1 스키마 필드
  offset_unit:           §2.1 스키마 필드
  offset_base:           §2.1 스키마 필드
  offset_end:            §2.1 스키마 필드
  newline:               §2.1 스키마 필드
  bom:                   §2.1 스키마 필드
  type_system_level:     §2.1 스키마 필드
  type_inventory:        §2.1 스키마 필드
  group_key:             §2.1 스키마 필드
  patient_key_available: §2.1 스키마 필드

# profile.json 의 refused 목록과 counts.by_refusal 에 들어가는 값
# (profiler.md §2.3). audit_refusal 과 같은 이유로 여기 있다.
#
# **거부가 하나라도 있으면 루프가 시작되지 않는다** — audit_report.json 과
# 다른 점이고, 이 산출물이 로드를 설정하기 때문이다. 빠진 bom 은 나쁜
# 프로필이 아니라 프로필이 아니다. 사람이 쓴 profiles/{corpus}.json 으로
# 되돌아가지 않는다 (profiler.md §2.3 마지막 문단).
profile_refusal:
  undeclared_value:      필드 어휘 밖의 값이다
  unknown_field:         §2.1 스키마에 없는 키다. 산문 키를 포함한다
  missing_field:         스키마 필드가 없다. 기본값은 없다 — 없는 규약은 규약이 아니다
  uncited_field:         cites 의 점 경로가 보낸 인벤토리에 없다
  type_not_in_inventory: type_inventory 의 라벨이 인벤토리 유형 집계에 없다. 발명된 코퍼스 라벨이다
  malformed:             JSON 객체 하나가 아니거나, type_inventory 가 문자열 리스트가 아니거나, unresolved 가 스키마 밖 필드를 부른다

# ─── Mapper: 근거와 거부 사유 ───────────────────────────────
# mapping.yaml 의 각 항목이 갖는 basis 값 (mapper.md §2.2). profiler 의
# cites 가 하는 일을 다른 방법으로 한다 — Mapper 의 입력은 두 목록이라
# 점 경로 인용이 "방금 쓴 값" 을 가리키게 되어 아무 증거가 아니다.
#
# **각 값에 코드가 검사할 수 있는 짝이 있다** (mapper.md §2.2 의 표).
# 그래서 basis 는 선언이 아니라 검증 가능한 주장이다. 짝이 깨지면
# basis_mismatch 로 거부한다.
mapping_basis:
  canonical_gloss:        표준 유형 자신의 범례가 이 종류를 지칭한다. map 항목에만 올 수 있다
  source_label_family:    원 라벨의 어간·접두어가 종류를 지칭하고 코퍼스에 그것을 공유하는 라벨 계열이 있다. map 항목에만, 그리고 인벤토리에 접두어를 공유하는 라벨이 둘 이상 있어야 한다
  source_type_is_coarser: 원 유형의 외연이 어느 표준 유형보다 넓어 거친 쪽을 택했다. map 항목에만, 대상이 병합을 선언한 표준 유형이어야 한다
  residual_bucket:        원 유형이 코퍼스 자신의 잔여 범주다. map 항목에만, 대상이 OTHER 여야 한다
  design_exclusion:       프로젝트가 채점에서 제외하는 유형이다. excluded 항목에만, 다른 어디에도 오지 않는다

# mapping.yaml 의 refused 목록과 counts.by_refusal 에 들어가는 값
# (mapper.md §2.3). 거부가 하나라도 있으면 루프가 시작되지 않고, 그것은
# §9.0 이 그 코퍼스를 덮는지와 무관하게 성립한다 — 실패 의미가 코퍼스에
# 따라 갈리면 그것은 어느 코퍼스가 돌고 있는지에 따라 갈리는 규율이고,
# CLAUDE.md 가 거부하는 형태다.
mapping_refusal:
  undeclared_value:      canonical·excluded_type·basis 가 어휘 밖이다
  unknown_field:         §2.1 스키마에 없는 키다. 산문 키를 포함한다
  missing_field:         항목에 canonical 또는 excluded_type 이 없거나 basis 가 없다
  type_not_in_inventory: 키가 profile.type_inventory 에 없다. 발명된 코퍼스 라벨이다
  unmapped_source_type:  인벤토리 라벨이 map 에도 excluded 에도 없다. 조용히 버려지는 gold 스팬 집합이다
  duplicate_source_type: 같은 라벨이 map 과 excluded 양쪽에 있다
  basis_mismatch:        basis 의 §2.2 짝이 성립하지 않는다
  malformed:             JSON 객체 하나가 아니거나, 항목이 객체가 아니거나, unresolved 가 map·excluded 밖 라벨을 부른다

# **mapping_unresolved 는 값을 갖지 않는다.** mapper.md §2.1 이 이 파일에
# 추가하겠다고 적었고, 구현이 그 약속을 이렇게 지킨다: unresolved 항목은
# map 또는 excluded 의 키이고 그 키는 코퍼스 자신의 라벨이다. 코퍼스 라벨은
# 이 파일이 담을 수 있는 닫힌 집합이 아니다 (profile.type_inventory 가 코퍼스
# 데이터다). 검사는 어휘 대조가 아니라 구조 대조 — map ∪ excluded 의 키인지 —
# 이고 malformed 가 그것을 거부한다. 값 없는 목록을 만들면 아무도 읽지 않는
# 블록이 남고, 그것이 이 규칙이 막으려던 두 번째 답이다.

# ─── LexiconBuilder: 파일명·근거·거부 사유 ──────────────────
# lexicons/{lang}/{name}.txt 의 {name} (lexicon_builder.md §1, §2.1).
# DESIGN §3 이 이 산출물에 쓴 세 단어 그대로이고 네 번째 값은 없다.
# 이 코퍼스에 필요한 네 번째 종류는 사람이 커밋으로 여기 추가한다 —
# 산출물 안에서 발명되지 않는다. 맞는 이름이 없을 때의 올바른 동작은
# undeclared_value 거부다.
lexicon_name:
  institutions: 병원·기관 이름
  regions:      행정 구역 이름
  departments:  진료과·부서 이름

# LexiconBuilder 프롬프트 §1.2 가 보여주는 표준 유형. **열 개가 아니라 셋이다.**
#
# 새 값이 아니라 phi_type 축의 부분집합 선언이고, 그래서 여기 있다. 모듈에
# ("ORGANISATION","LOCATION_AREA","LOCATION_STREET") 를 적으면 프롬프트가 무엇을
# 보여주는지가 코드 안의 리터럴이 되고, phi_type 이름이 바뀌면 조용히 어긋난다.
# 목록으로 두면 lexicon_target_types() 가 부분집합인지 대조하고 어긋남이 import
# 에서 터진다.
#
# 왜 셋인가는 프롬프트 §1.2 와 §3 에 있고 여기 되풀이하지 않는다. 요지만: NAME
# 은 의도적으로 빼고 (§3), 남는 일곱은 gazetteer 모양이 아니다 — 산출물이
# 서비스할 수 없는 유형까지 보여주면 갈 곳 없는 항목을 부른다.
#
# 이 목록과 lexicon_name 은 서로 다른 축이고 대응표가 아니다. departments 가
# ORGANISATION 을 서비스하는지 regions 가 LOCATION_AREA 를 서비스하는지는
# 규칙이 결정하는 것이고 (rules/*.yaml 의 어느 규칙이 어느 파일을 읽는가),
# 여기서 짝지으면 그 결정이 config 로 올라온다.
lexicon_target_types:
  - ORGANISATION
  - LOCATION_AREA
  - LOCATION_STREET

# 각 파일이 선언하는 basis (lexicon_builder.md §5 의 표). 세 값이 서로 다른
# 전이 행동을 주장하므로 선언이 반증 가능하다 — administrative_enumeration
# 을 선언한 파일의 fires-retained 가 낮으면 그 선언이 반증된 것이고,
# arm 의 누출률과 독립적으로 보고할 수 있는 발견이다.
lexicon_basis:
  administrative_enumeration:     닫힌 공식 목록 (주·자치구). 꼬리가 없으므로 전이가 높을 것으로 예측한다
  morphological_class:            생산적 명명 패턴의 머리 단어이고 개별 사례가 아니다. 계열은 fold 와 무관하므로 전이가 높을 것으로 예측한다
  general_knowledge_named_entities: 에이전트가 아는 실세계 기관명. 열린 집합이고 예측하지 않는다 — 합성 코퍼스에서는 양쪽 fold 모두 0 에 가까울 수 있다

# lexicon_manifest.json 의 refused 목록과 counts.by_refusal 에 들어가는 값
# (lexicon_builder.md §2.3).
#
# **거부된 항목은 버려지고 세어지고 arm 은 계속된다** — profile·mapping 과
# 다르고, 그 차이는 각 산출물이 하는 일에 대한 것이지 얼마나 신뢰하는지에
# 대한 것이 아니다. 항목 하나가 빠진 사전은 항목 하나가 빠진 사전이고,
# 그 귀결은 이 arm 이 하지 않는 탐지로서 누출률에 들어가 *보고된다*.
# 세 산출물 중 열화가 이미 headline 숫자에 보이는 유일한 것이므로 게이트가
# 필요하지 않다.
#
# 거부 사유에 표면형이 붙지 않는다. 거부된 항목은 파일명과 사유만 남기고
# 문자열은 남기지 않는다 — 출처 불명의 표면형을 두 번째 파일에 넣는 것은
# 디버깅 편의를 위해 산출물의 노출을 두 배로 만드는 거래이고, CLAUDE.md 가
# 예외 메시지에 대해 거부하는 거래와 같은 것이다.
lexicon_refusal:
  undeclared_value:            언어·파일명·basis 가 어휘 밖이다
  unknown_field:               §2.1 스키마에 없는 키다. 산문 키를 포함한다
  missing_field:               선언된 파일에 basis 또는 entries 가 없다
  malformed:                   JSON 객체 하나가 아니거나, entries 가 문자열 리스트가 아니다
  duplicate_entry:             한 파일에 같은 항목이 대소문자 무시로 두 번 있다. src/rules.py 가 case-fold 로 매칭하므로 두 표기는 한 항목이다
  entry_contains_newline:      항목이 두 줄이 되는 문자를 담고 있다
  entry_contains_comment_mark: 항목이 # 을 담고 있어 읽는 쪽이 잘라낸다
  entry_too_short:             항목이 3자 미만이다. 1~2자 gazetteer 항목은 어디에나 맞는다
  entry_is_vocabulary_term:    항목이 표준 유형명·사전 이름·층 이름과 같다. 에이전트가 지시문을 산출물에 되쓴 것이다
  empty_lexicon:               선언된 파일에 살아남은 항목이 없다. _read_lexicon 이 빈 파일을 로드에서 거부하므로 쓰기 시점에 잡는다

# **lexicon_unresolved 는 값을 갖지 않는다.** lexicon_builder.md §2.1 이 이
# 파일에 추가하겠다고 적었고, 구현이 그 약속을 이렇게 지킨다: unresolved
# 항목은 `{lang}/{name}` 이고 그 두 조각은 이미 선언되어 있다 — lang 은 축,
# name 은 위의 lexicon_name 이다. 세 번째 목록을 만들면 lexicon_name 에
# 값이 추가될 때 갱신을 잊는 목록이 하나 생기고, 그러면 새 사전 종류는
# "모른다" 고 말할 수 없는 종류가 된다. 허용 집합은 두 어휘의 곱으로
# 유도하고 여기 적지 않는다.

# ─── 유형이 확정되지 않은 마스크 태그 ───────────────────────
# 마스커가 겹치는 스팬들의 합집합을 마스킹할 때, 합집합이 유형 동질적이면
# 그 유형을 출력하고 (`[NAME]`), 이질적이면 이 값을 출력한다. DESIGN §3.
#
# **축이 아니고 어휘 목록도 아니다. 값 하나다** — model_id_absent 과 같은
# 층위다. 그럼에도 코드가 아니라 여기 있는 이유는 CLAUDE.md 의 규칙 그대로다:
# 프롬프트의 내용과 마스커의 출력에 들어가는 문자열이고, 마스커 안의 리터럴은
# 코드에서 발명된 어휘 항목이 된다.
#
# 어느 유형이 이기는지 정하지 않는 이유가 이 값이 존재하는 이유다. 정하면
# 마스커가 병합 정책을 갖게 되고, 그것이 RuleSet.detect 가 겹침을 남겨둔
# 이유(§9.3)를 무너뜨린다. 유형을 말하지 않는 것만이 판단을 하지 않는다.
#
# phi_type 축의 값이면 안 된다 — `[NAME]` 로 두면 이질 합집합이 동질 합집합과
# 구별되지 않고, 이 값이 막으려던 임의 선택이 표기 층에서 되살아난다.
# src/corpora/base.py 가 거부한다.
#
# 이름에 범례가 필요하지 않다 (파일 머리): PHI 는 "식별자이되 유형 미확정"
# 으로 읽히고, Auditor 관점에서는 `[NAME]` 과 똑같이 "이미 가려진 것" 이다
# (auditor.md §1.2 — 태그는 후보가 아니다).
masked_tag_heterogeneous: "[PHI]"

# ─── 표준 집합에서 제외한 유형 ───────────────────────────────
# DESIGN.md §9.1 이 제외한 세 유형. phi_type 축의 값이 **아니다** — 축에 넣으면
# 채점이 이 유형들 위에서 이뤄지고, 제외 결정 자체가 무너진다. 그래서 축과
# 나란한 별개 블록이고, phi_type 축의 주석이 여기를 가리킨다.
#
# **왜 config 에 있어야 하는가.** docs/prompts/auditor.md §1.1 이 이 세 유형을
# "추론에 맡기지 말고 범위 밖이라고 이름을 대라" 고 요구한다. `madre` 를 표시하는
# Auditor 는 텍스트에 대해 틀린 것이 아니고 이 프로젝트가 묻지 않는 질문에
# 답한 것이며, 그런 표시는 보고서에서 가장 실행 불가능한 범주(§4 의 case 2)로
# 떨어진다. 그 목록이 프롬프트의 *내용*에 들어가므로 CLAUDE.md 의 규칙 그대로
# config 에 있고 모듈에 리터럴로 있지 않다.
#
# **로더의 excluded_types 와 중복이 아니다.** src/corpora/meddocan.py 의
# EXCLUDED_TYPES 는 그 코퍼스의 원본 유형 이름이고 (`SEXO_SUJETO_ASISTENCIA`),
# 로딩 시 스팬에 excluded 표시를 붙이는 데 쓰인다 — 코퍼스마다 다르고, 그
# 코퍼스를 읽는 코드만 안다. 여기 있는 것은 코퍼스와 무관한 **개념**이고
# 에이전트에게 보여주는 이름이다. 한쪽에서 다른 쪽을 유도하지 않는다: 유도하면
# 로더가 없는 코퍼스(de-grascco)의 제외 유형이 프롬프트에서 조용히 사라지고,
# 그 침묵은 "제외가 없다" 와 구별되지 않는다.
#
# 값은 이름 → 한 줄 설명이고, 설명은 왜 범위 밖인지를 말한다. 이유가 두 종류라서
# (§9.1) 한 줄로 뭉개지 않는다 — 앞의 둘은 HIPAA Safe Harbor 식별자가 아니고,
# NAME_TITLE 은 두 코퍼스가 서로 호환되지 않게 주석했고 어느 쪽도 틀리지 않았다.
excluded_types:
  SEXO:       sex of the patient; not a HIPAA Safe Harbor identifier, so a detector scored on it is measured on something other than disclosure risk
  FAMILIARES: family relationship words; the surfaces are the common nouns madre, familia, padres — not names
  NAME_TITLE: titles such as Dr. or Prof.; the corpora annotate them incompatibly and neither is wrong, so keeping it would score one corpus's convention as another's false positive

# ─── 층 → 계열 ───────────────────────────────────────────────
# 상보성 분해(DESIGN.md §5)는 "rules only / tagger only / both / neither" 로
# 보고한다. 그러려면 어느 층이 rules 계열인지 알아야 하는데, 그 지식이 코드에만
# 있으면 layer 값을 탐지기 이름에서 유도하지 않는다는 규칙을 우회하는 것과 같은
# 종류의 문제가 된다 — 값은 config 에 있고 묶음은 코드에 있는 상태다.
#
# 계열 이름은 layer 축과 다른 층위의 개념이다. 같은 이름을 쓰면 스팬의 layer 에
# 계열을 채워넣어도 검증을 통과하게 되므로, **원소가 하나인 계열만 층 이름을
# 공유할 수 있다.** tagger 가 그 경우다 — 두 해석이 같은 것을 가리키므로 모호함이
# 틀린 값을 만들지 못한다. 학습 층이 하나 더 늘어 tagger 계열에 들어가는 순간
# layer="tagger" 가 "어떤 학습 층인가"를 뜻하게 되어 DESIGN.md §3 이 요구하는
# 층 단위 provenance 를 잃는다. 그 시점에 검증이 거부하고 계열 이름을 바꾸라고
# 말한다. 계열이 원소 하나여도 리스트로 적는다.
#
# 합집합이 layer 축과 정확히 일치해야 한다 — 누락도 잉여도 거부한다.
# 부분집합만 검사하면 새 층을 추가하고 계열에 넣는 것을 잊었을 때 통과하고,
# 그 층이 찾은 스팬은 조용히 neither 로 집계된다. 검증은 src/corpora/base.py
# 에 있다 (DESIGN.md §3).
layer_families:
  rules:  [regex_checksum, context_cue, gazetteer]
  tagger: [tagger]

# ─── 코퍼스 → 로드할 규칙 파일 목록 ──────────────────────────
# 탐지 실행은 이 목록의 파일을 **전부** 로드하고 매치를 합집합한다.
# 문서 단위 언어 판별을 하지 않는다 (DESIGN.md §5.2 의 결정).
#
# 언어 판별을 하지 않는 이유는 판별기의 오류가 현재 지표 집합 어디에서도
# 측정되지 않기 때문이다. 파일을 고르는 선택자든 문서를 쪼개는 세그멘터든,
# 그 자체의 정확도를 재는 지표가 없는 구성요소를 파이프라인에 넣으면 그
# 오류가 탐지 성능 안에 섞여 들어가 분리되지 않는다.
#
# 값은 위 lang 축에 정의된 것만 쓴다. 목록 길이가 1 이어도 리스트로 적는다 —
# 단일언어를 특수한 경우로 두지 않는다.
corpus_rule_langs:
  es-meddocan:  [es]
  es-carmen:    [es, cat]
  de-grascco:   [de]
  ko-surro:     [ko]
  en-n2c2:      [en]

# ─── 산출물 경로 ─────────────────────────────────────────────
# 조합이 곧 경로. 별도의 키 체계를 두지 않는다.
paths:
  metrics:  "results/{corpus}/{detector}/{supervision}/{porting}/metrics.json"
  spans:    "results/{corpus}/{detector}/{supervision}/{porting}/spans.jsonl"
  # 반복하는 arm 의 회차별 점수. DESIGN §5.5 (2026-08-12 정정).
  #
  # **metrics 를 넓히지 않고 두 번째 키를 둔다.** 넓히면 이미 커밋된
  # port-oneshot-nofence 의 metrics.json·spans.jsonl 이 ALLOW_PATTERNS 에
  # 걸리지 않고 metrics_path() 로 도달할 수 없게 된다. 옮기는 것도 열려 있지
  # 않다 — §4 가 다섯 번째 경로 성분을 거부한 이유가 그것이고, 이것이 그
  # 논거의 세 번째 등장이다 (§6.3 의 armfreeze/humanfreeze 분리가 두 번째).
  #
  # 그래서 metrics 는 축 넷 그대로 남고 **모든 arm 의 최종 점수** 가 거기
  # 쓰인다 (port-loop 포함). 마지막 회차의 점수는 두 경로에 같은 내용으로
  # 존재한다. 의도한 중복이다: 최종 점수를 iterN/ 에만 두면 arm 의 headline
  # 값을 읽는 것이 디렉토리 나열 + max 가 되고, 그건 §5.3 이 파일명 파싱을
  # 거부한 이유가 자리만 옮긴 것이다. run_fold 가 한 번의 채점으로 둘 다
  # 쓰므로 두 파일이 어긋날 수 없다.
  #
  # {iteration} 이 디렉토리인 이유는 armrules 와 같다.
  itermetrics: "results/{corpus}/{detector}/{supervision}/{porting}/iter{iteration}/metrics.json"
  # 회차별 예측. itermetrics 와 **함께** 움직인다 (DESIGN §5.5).
  #
  # run_fold 가 두 파일을 한 번의 채점으로 쓰므로, 점수만 회차별로 두면 예측은
  # 매 회차 덮이고 점수는 전부 남는다. 그건 둘 다 잃는 것보다 나쁘다 — 아래
  # itererrors 가 그 회차의 예측을 gold 에 대고 만든 파생물이므로, iter3 의
  # 오류 목록은 iter8 이 spans.jsonl 을 덮은 뒤에는 무엇으로도 재도출·검증할
  # 수 없다. 한 회차가 내는 세 파일(예측·점수·오류)은 한 기록이고, 함께
  # 회차별이 되거나 기록에 구멍이 남는다.
  iterspans: "results/{corpus}/{detector}/{supervision}/{porting}/iter{iteration}/spans.jsonl"
  # 봉인 평가의 점수. DESIGN §6.4 (2026-08-26 사전등록), 채점 경로와 같은 커밋.
  #
  # **metrics 를 재사용하지 않는 것이 이 키의 존재 이유 전부다.** run 블록의 split 은
  # 필수 필드지만 경로 성분이 아니다 (위 metrics 주석, §4 의 다섯 번째 성분 거부).
  # 그래서 test fold 점수를 metrics 에 쓰면 그 arm 의 dev headline 을 test 숫자로
  # 덮는다. 되돌릴 수 없는 실행이 마지막에 하는 일이 그것이면 안 된다.
  # write_metrics 는 split=test 와 이 키를 서로 요구한다 — 한쪽만으로는 쓰지 못한다.
  #
  # **{iteration} 이 없다.** §6.4 는 arm 마다 마지막 회차 하나만 채점하도록
  # 사전등록했다. 회차 성분은 한 arm 의 두 회차 test 점수가 공존할 수 있다고
  # 말하는 것이고, 그것이 규약이 금지하는 상태다. armprofile 세 키에서 회차를 뺀
  # 것과 같은 논거이고 (2026-08-26), 여기서는 규약이 그 상태를 금지한다는 점에서
  # 더 강하다.
  #
  # 재실행은 이 파일을 덮는다. 두 번의 개방을 남기는 것은 sealed_eval_log.md 의
  # 두 행이고 (§6.4: 재실행은 두 번째 개방이다) 파일 두 개가 아니다.
  #
  # **옆에 spans·errors 를 두지 않는다.** errors.jsonl 은 그 fold 에서 놓친 모든
  # 식별자의 위치이고 다음 회차 창의 입력이다. test fold 에 대해 그것을 만드는
  # 것은 CLAUDE.md 가 금지한 "test 오류를 보고 고치는 것" 의 입력을 준비하는
  # 일이다. 그래서 deny 로 막는 것이 아니라 애초에 쓰지 않는다 — 막아야 할 파일을
  # 만들지 않는 것이 막는 것보다 강하다. spans 는 표면형이 없어 공개 가능하지만
  # 이 저장소에서 그것을 읽는 것은 마스커와 루프 기계뿐이고, 봉인 fold 에는 다음
  # 회차가 없다. 봉인 실행이 쓰는 파일은 하나다.
  sealedmetrics: "results/{corpus}/{detector}/{supervision}/{porting}/test/metrics.json"
  agentlog: "results/{corpus}/{detector}/{supervision}/{porting}/agent_calls.jsonl"
  # Auditor 의 보고서. DESIGN §5.5 — 의심되는 잔존 PHI 의 위치 목록이다.
  #
  # **deny 대상이다. ALLOW 에 올리고 sniffer 에 맡기지 않는다.** DUA 코퍼스에서
  # 이 파일은 남아 있는 식별자의 지도이고, 루프가 만드는 것 중 그런 성질이 가장
  # 농축된 산출물이다. §6.1 의 allowlist 논거가 가는 방향이 deny 다 — 경로가
  # 내용 sniffer 를 면제받을 수 있는 것은 경로 규칙이 이미 그 파일을 공개하기로
  # 했을 때뿐이고, 이것을 공개해야 할 이유는 아무것도 없다. metrics.json 과
  # spans.jsonl 이 탐지에 대해 독자가 필요한 것을 이미 담는다. 나중에 이 파일의
  # 집계가 필요해지면 metrics.json 에 파생 카운트를 더하는 것이고, 이 경로의
  # 분류를 바꾸는 것이 아니다.
  #
  # **§3 이 적은 `reports/leaks_{iter}.json` 을 그대로 쓰지 않는다.** 그 경로에는
  # 축이 하나도 없고, 그건 §5.3 이 rules/{lang}.yaml 에서 고친 결함과 같다 —
  # 두 arm 이 한 파일에 쓰고 나중에 돈 arm 이 먼저 돈 arm 을 덮는다.
  # 표면형은 담지 않는다: 오프셋·유형·점수만이고, 그 규약은 이 파일을 쓰는
  # 코드가 지킨다 (CLAUDE.md).
  auditreport: "results/{corpus}/{detector}/{supervision}/{porting}/iter{iteration}/audit_report.json"
  # 한 회차가 여러 번 감사된 경우, 각 draw 의 보고서. DESIGN §5.5.2.
  #
  # 완료되지 않은 회차는 재실행이 허용되고 (타임아웃으로 죽은 회차를 거부하면
  # 타임아웃이 arm 을 죽인다), 재실행은 auditreport 를 덮는다. 덮이면
  # agent_calls.jsonl 의 250×M 줄과 보고서 한 개가 "몇 번 감사했는가" 에 대해
  # 불일치한다. 이 경로가 그 불일치를 없앤다 — draw 마다 자기 파일이 있고,
  # 어느 것도 나중 draw 에 의해 덮이지 않는다.
  #
  # **파일명이 audit_report.json 인 것은 의도다.** release_screen 의 deny 는
  # 이름으로 걸려 있고 (`(^|/)audit_report\.json$`), 이 파일은 그 deny 를
  # 그대로 상속해야 한다. `audit_report.draw2.json` 처럼 접미사를 붙이면
  # deny 를 빠져나가고, 그러면 잔존 식별자 지도를 공개하지 않기 위해 deny 를
  # 넓히는 편집을 하게 된다 — 방향이 거꾸로다. 디렉토리를 하나 더 두는 쪽이
  # 스크리너를 건드리지 않는다.
  #
  # {draw} 는 축이 아니다. iteration 과 같은 정수이고, round_path 가 축으로
  # 검사하지 않는 유일한 컴포넌트가 iteration 인 것과 같은 이유다: 닫힌 어휘가
  # 아니라 순번이다.
  auditdraw: "results/{corpus}/{detector}/{supervision}/{porting}/iter{iteration}/draw{draw}/audit_report.json"
  # 채점기의 스팬 단위 오류 목록. 다음 회차의 §1.4 표본이 여기서 뽑힌다.
  # DESIGN §5.5 — score() 의 반환값을 넓히지 않고 run_fold 가 별도 파일로 쓴다.
  #
  # auditreport 와 같은 이유로 deny 대상이다. 오히려 더 직접적이다: 이건
  # *의심* 목록이 아니라 그 fold 에서 놓친 모든 식별자의 위치 목록이고,
  # gold 에서 나온다. ErrorSpan 이 doc_id·span_index·오프셋만 담고 표면형
  # 필드를 갖지 않는 것이 그 방어의 절반이며 (src/sample.py), 경로 규칙이
  # 나머지 절반이다.
  #
  # 회차별인 이유: 회차 n 의 표본이 무엇에서 뽑혔는지가 사후에 답할 수 있어야
  # 한다. 한 경로에 덮어쓰면 마지막 회차의 오류 목록만 남고, "회차 4 에서
  # 에이전트가 무엇을 봤는가" 는 §5.3 이 규칙 파일에 대해 요구한 것과 같은
  # 질문이다.
  itererrors: "results/{corpus}/{detector}/{supervision}/{porting}/iter{iteration}/errors.jsonl"
  # port-human 전용. {porting} 이 템플릿이 아니라 고정값인 유일한 경로다 —
  # 이 파일은 그 축의 값 하나에만 존재하고, 템플릿으로 두면 다른 arm 이
  # 여기에 쓰도록 초대하는 셈이다 (DESIGN §11.2).
  humanlog: "results/{corpus}/{detector}/{supervision}/port-human/human_log.jsonl"
  # 동결 기록. humanlog 와 같은 디렉토리이고, 회차 1 전에 한 번만 쓰인다.
  # 각 로그 행이 그 시점의 창을 정직하게 기록하므로, 시작 시점의 창을 아는
  # 방법은 이 파일뿐이다.
  humanfreeze: "results/{corpus}/{detector}/{supervision}/port-human/window_freeze.json"
  # 에이전트 arm 의 동결 기록. DESIGN §6.3 — 창은 처음 쓰이는 시점에 얼리고,
  # arm 마다 자기 기록을 갖는다. port-oneshot 은 port-human 의 기록을 물려받지
  # 않는다.
  #
  # **humanfreeze 를 템플릿으로 넓히지 않고 키를 따로 둔다.** 넓히면 에이전트
  # arm 이 port-human 의 경로에 쓸 수 있게 되고, 그러면 철회된 arm 의 기록이
  # 나중에 시작한 arm 에 의해 조용히 덮인다 — arm_has_started() 가 닫은 결함이
  # 경로 층에서 되살아나는 것이다. 두 키가 같은 디렉토리 규칙을 공유하면서
  # 서로의 파일에 닿지 못하는 것이 의도다. 파일명이 같은 이유는 같은 종류의
  # 기록이기 때문이고, 그것이 두 키를 하나로 합칠 이유는 아니다.
  armfreeze: "results/{corpus}/{detector}/{supervision}/{porting}/window_freeze.json"
  # 형식 실패 기록. DESIGN §10 A2 — 형식 재시도는 0 이고, 실패는 사고가 아니라
  # 보고 가능한 결과다. 스키마를 통과하지 못하는 파일이 돌아오면 metrics.json 은
  # 쓰지 않고 (0 으로 채운 metrics 는 "돌았지만 아무것도 못 잡은 규칙집합" 과
  # 구별되지 않는다) 대신 이 파일을 쓴다: model_id 세 필드, 원문 응답,
  # 검증기의 오류 메시지 원문. cost 블록은 양쪽 다 쓴다 — 호출은 이뤄졌고
  # 비용이 나갔다.
  #
  # metrics 와 같은 디렉토리에 별도 파일로 두는 이유: 한 arm 의 결과는 metrics.json
  # 이 있거나 format_failure.json 이 있거나 둘 중 하나이고, 파일 이름이 그 답이다.
  # metrics.json 안의 status 필드로 두면 채점기 스키마가 "점수 없는 metrics" 를
  # 허용해야 하고, 그러면 실패가 아닌 이유로 점수가 빠진 파일도 통과한다.
  #
  # **원문 응답을 담으므로 스크리너 ALLOW 목록에 오른다.** 응답은 모델의 말이고
  # 코퍼스 텍스트가 아니지만, 프롬프트를 되풀이하는 응답은 §1.4 블록을 함께
  # 옮긴다 — 그래서 첫 호출(§§1.1-1.2)에만 이 경로가 쓰이는 것으로는 근거가
  # 부족하고, 내용 sniffer 가 먼저 돌아 판단한다. ALLOW 는 경로에 대한 진술이고
  # 내용에 대한 진술이 아니다 (release_screen.py).
  formatfailure: "results/{corpus}/{detector}/{supervision}/{porting}/format_failure.json"
  # {lang} 은 규칙 파일의 언어다 (lang 축). 코퍼스 하나가 여러 파일을 로드할 수
  # 있으므로 이 경로는 코퍼스당 1:1 이 아니다. 어느 파일들을 로드할지는
  # corpus_rule_langs 가 정한다.
  #
  # **rules 는 형식 예시와 부트스트랩 전용이다. arm 이 쓰는 규칙 파일은
  # armrules 다** (DESIGN §5.3, 2026-08-08). 이 경로에는 축이 하나도 없다 —
  # corpus·detector·supervision·porting 넷 다 없고 iteration 도 없다. 그러면
  # port-oneshot 과 port-loop 가 같은 파일에 쓰고, 나중에 돌린 arm 이 먼저
  # 돌린 arm 의 규칙을 덮는다. armfreeze 를 humanfreeze 에서 분리한 것과
  # 같은 문제가 한 단계 아래에서 재발하는 것이다: 그때는 두 arm 이 같은
  # *기록* 을 공유하는 문제였고, 이번엔 같은 *입력* 을 공유하는 문제다.
  # 후자가 더 나쁘다 — 덮인 기록은 없어진 것이 보이지만, 덮인 규칙 파일은
  # metrics.json 의 rules_version 과 rules 목록이 그대로 그럴듯하게 남는다.
  rules:    "rules/{lang}.yaml"
  # arm 이 실제로 쓰는 규칙 파일. 축 넷에 {iteration} 을 더한다.
  #
  # {iteration} 이 파일명 접미사가 아니라 디렉토리인 이유: es-carmen 은 한
  # 회차에 es 와 cat 두 파일을 낸다 (corpus_rule_langs). 한 회차의 규칙 상태는
  # 그 파일들 전부이므로 한 디렉토리에 담기는 것이 맞다 — es_iter3.yaml 과
  # cat_iter3.yaml 이 나란히 있으면 회차 하나를 로드하는 것이 파일명 파싱이
  # 된다.
  #
  # `rules/` 성분을 남긴 이유는 release_screen.py 의 rule_id 어휘 검사가
  # `(^|/)rules/[^/]+\.ya?ml$` 로 걸리기 때문이다. 그 검사는 rule_author.md
  # Prohibition 2 (규칙 이름에 표면형 금지) 의 유일한 실제 집행이고, 경로에서
  # `rules/` 를 빼면 arm 이 쓴 파일이 검사를 통과하지 않고 *지나간다*.
  # 스크리너 쪽 정규식을 이 경로에 맞추는 변경이 함께 들어간다.
  armrules: "results/{corpus}/{detector}/{supervision}/{porting}/rules/iter{iteration}/{lang}.yaml"
  # ─── 에이전트가 저술하는 보조 입력 셋 (DESIGN §4, 2026-08-26) ───────────
  #
  # port-multi 가 port-loop 에 더하는 한 능력은 "루프가 소비하지만 생산하지 않는
  # 보조 산출물을 에이전트가 쓰는가" 이고, 그 산출물이 profile · mapping · lexicon
  # 이다. Profiler · Mapper · LexiconBuilder 가 각각 하나를 쓴다 (§3 의 한 에이전트
  # 한 파일 규칙).
  #
  # **아래 축 없는 세 키(lexicon · profile · mapping)를 넓히지 않고 키를 따로 둔다.**
  # armrules 가 rules 를 남긴 채 추가된 것과 같은 형태이고 (§5.3), 이번에는 넓히지
  # 못하는 이유가 하나 더 있다: 축 없는 세 경로에는 사람이 쓴 판본이 산다.
  # paths.lexicon 은 규칙의 사전 형식이 실제로 읽는 살아 있는 소비자를 갖고
  # (src/rules.py), profiles/ 에는 추적되는 파일들이 이미 있다. 템플릿에 축을 더하면
  # 그 소비자는 채울 수 없는 필드를 만나고, 추적 중인 파일들은 어떤 키도 이름 짓지
  # 않는 경로에 남는다.
  #
  # 이것이 같은 결함의 **세 번째 재발**이다. 첫 번째는 armfreeze/humanfreeze —
  # 두 arm 이 같은 *기록* 을 공유했다. 두 번째는 armrules/rules — 같은 *규칙 입력* 을
  # 공유했다. 세 번째가 이 셋이다. 앞의 둘과 다른 점은 덮이는 것이 arm 의 산출물이
  # 아니라 **루프의 입력**이고, 덮이는 시점이 arm 이 도는 중이라는 것이다. 규칙 파일은
  # 앞선 arm 이 끝난 뒤에 덮이지만, 이 셋은 나중 arm 의 Profiler 가 먼저 arm 이 아직
  # 회차를 돌고 있는 동안 덮을 수 있다. 그러면 두 arm 이 서로의 입력 위에서 돌고,
  # 어느 쪽 결과도 자기 입력에 대응하지 않는다 — 실행 자체가 오염된다.
  #
  # **{iteration} 이 없다. 축 넷이다.** armrules 와 갈리는 유일한 지점이고 의도다.
  # §4 의 능력 정의가 이 셋을 "루프가 읽고 고치지 않는 입력" 이라고 말한다. 회차
  # 성분을 넣으면 경로가 "회차마다 다시 저술된다" 고 주장하는 셈이고, 그건 능력
  # 정의가 부정하는 것이다. armfreeze 와 같은 모양인 것이 맞다: arm 당 한 번 쓰인다.
  # 미완료 arm 재실행이 이 파일들을 덮는 문제는 남는다 — auditdraw 가 draw 성분으로
  # 푼 것과 같은 문제이므로, 필요해지면 같은 처방을 따로 논한다. 능력 정의와
  # 어긋나는 성분을 예방적으로 넣지 않는다.
  #
  # **스크리너 분류가 셋에서 갈린다.** 저자가 사람에서 에이전트로 바뀌는 것이 파일의
  # 내용 위험을 바꾸지 않으므로, 각 산출물은 자기가 대체하는 손으로 쓴 판본의 분류를
  # 물려받는다. armprofile 은 형식 · 오프셋 규약 · 유형 목록 · 그룹 키이고, 사람이 쓴
  # 판본이 profiles/ 에 추적되고 있다. armmapping 은 코퍼스 분류 → 정규 유형이고,
  # 양쪽 다 유형 이름이며 사람이 쓴 판본이 §9.0 의 표로 이미 공개되어 있다. 그래서
  # 둘은 deny 하지 않고 기본 내용 sniff 에 맡긴다 — ALLOW 에도 올리지 않는다.
  # ALLOW 는 sniff 면제이고, 이 둘을 면제할 이유는 없다.
  armprofile: "results/{corpus}/{detector}/{supervision}/{porting}/profile.json"
  armmapping: "results/{corpus}/{detector}/{supervision}/{porting}/mapping.yaml"
  # **셋 중 이것만 deny 대상이다** (release_screen.py, .gitignore). 왜 이것만 다른가:
  # 사전은 기관 · 지역 · 부서 이름의 목록이고, 목록 *외에* 아무것도 아니다. 규칙 파일도
  # 용어 목록을 담지만 패턴 · 단서어와 함께 담아서 rule_id 어휘 검사와 rule_author.md
  # Prohibition 2 가 걸릴 표면이 있다. 이 파일에는 그 표면이 없다. 그리고 물려받을
  # 사람 판본의 인스턴스가 아예 없다 — 위 규칙이 armprofile · armmapping 을 통과시킨
  # 근거가 이 키에는 없다. 마지막으로 스크리너는 경로에서 *출처* 를 알 수 없다:
  # 공개 gazetteer 로 만든 사전과 dev 원문에서 뽑은 사전이 같은 경로로 온다.
  # 구별할 수 없으면 §6.1 의 allowlist 논거가 가는 방향이 deny 다.
  #
  # deny 는 `^results/` 로 앵커한다. `(^|/)lexicons/` 로 걸면 아래 축 없는 lexicon —
  # 사람이 쓰는 자리이고 src/rules.py 가 읽는 살아 있는 입력 — 까지 잡는다.
  # audit_report 를 디렉토리가 아니라 이름으로 거는 판단의 반대 방향이고 이유는 같다:
  # 규칙의 단위가 잡아야 할 것과 정확히 겹쳐야 한다.
  armlexicon: "results/{corpus}/{detector}/{supervision}/{porting}/lexicons/{lang}/"
  # armlexicon 이 담을 수 없는 것을 담는 사이드카 (lexicon_builder.md §2.2).
  # {lang} 이 없다 — 한 호출이 코퍼스의 모든 언어를 쓰므로 (§1.3) 매니페스트도
  # 하나다. 언어마다 매니페스트를 두면 파일 간 중복이 보이지 않게 되고, 그것이
  # 한 호출로 묶은 이유였다.
  #
  # **deny 대상이 아니다. armlexicon 은 deny 이고 이것은 아니다.** 근거는 위
  # armprofile · armmapping 을 통과시킨 것과 같다: 이 파일에는 항목 텍스트가
  # 없다 (§2.2 — 파일별 개수와 basis 뿐이고, 거부는 파일명과 사유만 남기고
  # 거부된 문자열은 남기지 않는다). 표면형이 들어오면 그 순간 이 분류가
  # 무효가 되고, 그것은 스키마를 넓히는 것이 아니라 스크리너 결정을 뒤집는
  # 것이다 (profiler.md §3 의 마지막 문단과 같은 형태의 의존).
  armlexiconmanifest: "results/{corpus}/{detector}/{supervision}/{porting}/lexicon_manifest.json"
  # 세 산출물의 해시를 저술 직후 · 첫 회차 직전에 한 번 얼린 기록
  # (src/porting/multi.py). armfreeze 가 프롬프트 창에 대해 하는 일을 산출물에
  # 대해 한다.
  #
  # **회차가 별개 프로세스이기 때문에 이 파일이 필요하다.** tools/run_loop.py 는
  # 한 번에 한 회차를 돌리고 "the chain is on disk, not in a process" 다. 그래서
  # "루프가 세 산출물을 고치지 않았다" 를 프로세스 안의 변수로 확인할 수 없다.
  # _refuse_existing 은 *쓰기* 를 막지만 회차 4 에서 손으로 고친 mapping.yaml 은
  # 막지 못한다 — 그건 덮어쓰기가 아니라 편집이다. 얼린 해시가 그것을 잡는다.
  # {iteration} 이 없는 이유는 armprofile 세 키와 같고, 같아야 한다: 이 기록의
  # 주장이 "회차에 불변" 이다.
  #
  # **deny 대상이 아니다.** 근거는 armlexiconmanifest 와 같다 — 파일 이름과
  # sha256 뿐이고 항목 텍스트가 없다. 사전 파일 키는 `{lang}/{name}.txt` 이고
  # {name} 은 lexicon_name 어휘값이다 (표면형이 아니다).
  armartefactfreeze: "results/{corpus}/{detector}/{supervision}/{porting}/artefact_freeze.json"
  # ─── 사람이 쓴 판본 셋. 축이 없고, 그대로 남는다 ────────────────────────
  # 위 arm 범위 키 셋이 덮는 것은 이 경로들이 아니라 이 경로들의 *에이전트 판본* 이다.
  # port-multi 아래의 모든 rung 은 여기 있는 것을 읽는다 (§9.0 — 매핑은 "모든 arm 이
  # 공유하는 설계 입력, 한 arm 의 산출물이 아니다").
  lexicon:  "lexicons/{lang}/"
  profile:  "profiles/{corpus}.json"
  mapping:  "mappings/{corpus}.yaml"
  # Profiler 의 **입력**이고 사람 판본의 형제가 아니다. profile 은 사람이 쓴
  # 프로필(해석)이고 이것은 손으로 쓴 인벤토리 스크립트의 산출물(측정)이다
  # (profiler.md §1.1: "인벤토리는 측정하고 Profiler 는 해석한다"). 축이 없는
  # 이유는 profile 과 같다 — 코퍼스마다 하나이고 arm 에 불변이다.
  #
  # **여기 있는 이유는 이 경로가 커밋되는 값이 되었기 때문이다.** profile.json
  # 은 자기가 보낸 인벤토리의 sha256 을 기록하고 (§2.2 의
  # inventory_filtered_sha256), 그 해시가 가리키는 파일이 무엇인지는 경로가
  # 정한다. 모듈 안의 리터럴이면 그 답이 코드에 있고 결과 파일이 참조하는
  # 것은 어휘가 아니게 된다.
  inventory: "profiles/{corpus}.raw.json"
  # **축이 없고, 그것이 결함이 아니다.** 위 재발 판정이 이 키에 걸리지 않는 이유를
  # 적어둔다 — 축 없는 키가 전부 결함이면 이 키에도 arm 축을 붙이게 된다.
  # 분할은 arm 에 불변이어야 한다. arm 축이 들어가면 arm 마다 다른 분할이 가능해지고,
  # 그러면 두 arm 의 점수가 서로 다른 fold 에 대한 값이 되어 §4 의 사다리가 비교하는
  # 것이 없어진다. 봉인도 무의미해진다: 봉인된 것은 이 파일이 지목한 fold 이므로,
  # arm 이 자기 fold 를 고를 수 있으면 arm 마다 다른 것을 봉인한 것이 된다.
  # rules 가 판정에서 빠지는 이유는 이것과 다르다 (arm 판본이 armrules 로 따로 있다).
  split:    "splits/{corpus}.json"

# ─── 예시 ────────────────────────────────────────────────────
# results/es-meddocan/RT/sup-free/port-loop/metrics.json
# results/ko-surro/R/sup-free/port-human/metrics.json
# results/es-meddocan/R/sup-free/port-oneshot/rules/iter1/es.yaml
# results/es-carmen/R/sup-free/port-loop/rules/iter3/cat.yaml
# results/es-meddocan/R/sup-free/port-oneshot/format_failure.json
# results/es-meddocan/R/sup-free/port-multi/profile.json
# results/es-meddocan/R/sup-free/port-multi/mapping.yaml
# results/es-meddocan/R/sup-free/port-multi/lexicons/es/
