# config/data_paths.example.yaml
#
# 코퍼스 ID → 로컬 경로 매핑의 템플릿.
# 이 파일을 config/data_paths.local.yaml 로 복사해서 자기 기계에 맞게 고친다.
#
#     cp config/data_paths.example.yaml config/data_paths.local.yaml
#
# local 파일은 .gitignore 에 있다. 기계마다 다르고, DUA 대상 데이터의
# 위치를 노출하기 때문이다. 이 example 파일만 커밋한다.
#
# 규칙
#   - 코퍼스 ID 는 config/naming.yaml 의 corpus 축 값만 쓴다.
#   - **어떤 코드도 코퍼스 경로를 하드코딩하지 않는다.** 이 매핑에서 읽는다.
#     경로가 저장소 안인지 밖인지도 코드가 알 필요가 없어야 한다.
#   - 저장소 밖 경로가 허용된다. DUA 데이터는 저장소 밖에 두는 편이 안전하다
#     — release_screen.py 가 못 보는 곳이라 실수로 스테이징될 수 없다.
#   - '~' 는 확장한다. 상대 경로는 저장소 루트 기준이다.

version: 1

corpora:
  # 저장소 안. data/* 는 gitignore 되고 release_screen.py 가 차단한다.
  es-meddocan: data/raw/es-meddocan
  de-grascco:  data/raw/de-grascco

  # es-carmen 은 PhysioNet credentialed 접근이 필요한 실제 병원 기록이고, 이
  # 항목은 배포본이 아니라 **파생 루트**다. **2026-10-01 변경**: 이전 판은 풀어
  # 놓은 배포본(`~/path/to/carmen-i`)을 직접 가리키게 되어 있었다. 봉인이 그것을
  # 불가능하게 만든다 — 이 코퍼스는 문서당 파일이므로 봉인이 파일 이동이고,
  # 제자리 봉인은 배포본에서 400 문서의 파일을 지우는 것을 뜻한다. 봉인은 물리적
  # 분리이므로(DESIGN §6.1) 배포본을 온전히 남기는 제자리 봉인은 없다.
  # 그래서 배포본을 먼저 복사해 이 루트를 만들고, 봉인은 복사본에서만 한다.
  # 배포본 경로는 config 가 아니라 명령줄 인자다 — 한 번 쓰고 끝나는 입력이고,
  # 코드가 그 경로를 아는 것 자체가 봉인을 우회하는 길이기 때문이다:
  #
  #     python3 tools/prepare_carmen.py verify-release --release-dir <배포본>
  #     python3 tools/prepare_carmen.py stage         --release-dir <배포본>
  #     python3 tools/prepare_carmen.py seal
  #
  # verify-release 는 배포본의 SHA256SUMS.txt 에 대고 검증하며, stage 전과 seal
  # 후에 각각 돌린다 — "배포본이 온전히 남았다" 가 주장이 아니라 측정이 되도록.
  # 취득은 data/acquire/fetch_carmen.sh 를 읽을 것.
  # ko-surro·en-deid 와 결론은 같고 이유는 다르다: 그 둘은 레코드가 한 파일 안에
  # 있어서 재작성이 필요했고, 여기는 재작성이 아니라 배포본 보존이다.
  es-carmen:   data/raw/es-carmen

  # ko-surro 는 원천 배포본 디렉토리, en-deid 는 그 배포본에서 만든 파생
  # 디렉토리다. 한 배포본의 두 절반이지만 경로가 다른 이유는 봉인이다 —
  # en-deid 는 2,434 레코드가 세 파일 안에 들어 있어서 test fold 를 빼내려면
  # 파일을 다시 써야 하고, 원천 배포본은 읽기 전용으로 둔다.
  # tools/prepare_endeid.py 가 만든다. 분할 도출 방향도 정해져 있다
  # (DESIGN §6.5: en-deid 를 먼저 정의하고 ko-surro 를 도출한다).
  ko-surro:    ~/path/to/deid-release
  en-deid:     data/raw/en-deid

  # 아직 취득하지 않음. 취득하면 주석을 풀고 경로를 적는다.
  # en-n2c2:   ~/path/to/n2c2-2014

# ─── 봉인된 test fold ───────────────────────────────────────
# **corpora: 와 분리된 키다.** 같은 키에 두면 코퍼스 경로를 순회하는 코드가
# 봉인된 fold 까지 함께 로드한다 — 봉인은 "읽지 않기로 한다"가 아니라
# "읽을 경로를 모른다"여야 한다. corpus_root() 는 이 블록을 보지 않고,
# sealed_root() 만 본다.
#
# 규칙
#   - 기본 위치는 저장소 안 sealed/{corpus}/ 다. .gitignore 가 sealed/ 를
#     무시하고, release_screen.py 는 그것을 **SEALED 라는 별개 줄**로 매 실행
#     보고한다 — 0 이 아닌 것이 정상이고 exit 0 이다. 다른 denied 경로처럼
#     quarantined 로 접어 넣지 않는 이유는 봉인된 fold 가 스크롤해 지나칠
#     대상이 아니기 때문이다. **git 이 볼 수 있게 되면 SEALED 가 아니라
#     BLOCKED 다** (스테이징·추적). 그게 실제 위반이고, 그때만 커밋이 막힌다.
#   - 이 경로를 직접 열지 않는다. test 평가는 src/eval/run_sealed_eval.py
#     로만 하고, 실행 사실은 results/sealed_eval_log.md 에 남는다.
#   - 항목이 없으면 그 코퍼스는 봉인되지 않은 것이다. 봉인 전 상태와
#     구분되어야 하므로 비워두는 것이 기본값이다.
sealed:
  es-meddocan: sealed/es-meddocan
  de-grascco:  sealed/de-grascco      # 2026-09-21 봉인
  en-deid:     sealed/en-deid         # 2026-09-21 봉인 (484문서 · 30환자)

  # es-carmen 은 2026-10-01 봉인, 400 문서. 같은 순서(생성 → 동결 → 봉인)를
  # 따랐고 — splits/es-carmen.json 동결이 먼저, 봉인이 그 다음이다. 다섯 중
  # 처음으로 봉인이 재작성이 아니라 **파일 이동**이다. 옮기는 것은 로더가 읽는
  # 것보다 많다: 배포본은 같은 문서를 다섯 벌(ann/{masked,replaced}/{anon,ner}/
  # 와 txt/{masked,replaced}/)로 싣고, 로더는 replaced/anon 만 읽지만 나머지도
  # 같은 DUA 의 코퍼스 원문이다. test 문서의 txt/replaced/ 복사본을 가시 루트에
  # 남기는 것은 규칙 개발이 읽는 곳에 그 fold 의 원문을 남기는 것이므로, 봉인은
  # 모든 변이·층·텍스트 디렉토리의 문서당 파일을 전부 옮긴다.
  # 루트마다 다시 계산되는 파일이 셋 있다 (복사가 아니다): 문서당 한 행인
  # CARMEN1_mappings.tsv, 스팬당 한 행인 tsv/ 의 집계 export 네 개,
  # 그리고 SHA256SUMS.txt. 로더는 매 로드마다 mappings 를 그 루트에서 읽어
  # 문서 집합과 비교하고 불일치를 거절한다 — ko-surro 의 reference.json 과 같은
  # 이유로, 복사된 집계는 다른 루트에 대한 주장이 된다.
  es-carmen:   sealed/es-carmen      # 2026-10-01 봉인 (400문서)
  #
  # ko-surro 항목은 en-deid 의 분할에서 도출되므로 손으로 적지 않는다.
  # tools/derive_aligned_split.py 를 읽을 것 (DESIGN §6.5).
