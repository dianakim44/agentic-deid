# config/split.yaml
#
# 구성된(constructed) 분할의 수치 파라미터. `src/split.py` 만 이 파일을 읽는다.
#
# naming.yaml 이 아니라 별도 파일인 이유는 config/sampling.yaml 과 같다 —
# naming.yaml 은 실험 식별자의 정의처이고, 여기 있는 것은 식별자가 아니라 수치
# 파라미터다. 한 파일에 섞으면 "naming.yaml 의 어휘만 쓴다"는 규칙이 어휘가 아닌
# 값에도 적용되는 것처럼 읽힌다. 두 파일 모두 커밋되고, 두 파일 모두 결과에
# 기록된다 (여기 값은 splits/{corpus}.json 의 provenance 블록에 복사된다).
#
# **공식 분할을 쓰는 코퍼스는 여기 없다.** es-meddocan 은 배포본의 분할을 그대로
# 쓰므로 시드도 층화도 없고, 항목을 만들면 쓰이지 않는 값이 커밋된다.
#
# **이 파일을 바꾸면 이미 동결된 분할이 재현되지 않는다.** 분할 파일은 봉인의
# 기준점이므로(CLAUDE.md), 항목 하나가 동결된 뒤에 그 항목을 고치는 것은 봉인을
# 다시 여는 것과 같다. 새 코퍼스는 항목을 추가하고, 기존 항목은 고치지 않는다.

version: 1

corpora:
  de-grascco:
    # DESIGN §9.6 "GraSCCo's constructed split". 문서 수 기준 목표 비율이고,
    # 할당의 원자는 §9.5 의 그룹이다 (60 단위 / 63 문서).
    proportions:
      train: 0.50
      dev:   0.30
      test:  0.20

    # 층화 변수. 문서당 in-scope 골드 스팬 수의 3분위.
    # 누출률의 분모가 스팬 수이므로 층화하는 것이 스팬 수다 (DESIGN §9.6).
    # 문서유형으로 층화하지 않는 이유도 같은 절에 있다 — 63 문서 중 13 만
    # 명시적 유형 행을 갖고, 내용 단서는 배타적이지 않아 분할(partition)이
    # 되지 않는다.
    stratify_by: in_scope_span_count
    n_strata: 3

    # 시드. 이 값을 바꾸면 분할이 바뀐다. 실행 시각·딕셔너리 순서·프로세스
    # 난수 상태는 할당에 들어가지 않는다 — 그것이 이 값이 여기 있는 이유다.
    seed: 20260921
