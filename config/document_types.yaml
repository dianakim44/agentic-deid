# config/document_types.yaml
#
# 문서유형 라벨을 **문서 본문에서 유도하는 단서(cue)**. 라벨 이름 자체는
# config/naming.yaml 의 document_type 블록에 있고 여기 없다 — 어휘와 유도를 한
# 파일에 두면 코퍼스를 하나 더 붙이는 편집이 어휘를 함께 움직인다.
#
# **왜 config 이고 코드가 아닌가.** 이 정규식이 metrics.json 의
# `by_document_type` 을 만든다. 보고되는 수치를 만드는 규칙은 코드가 아니라
# config 에 두고 버전을 결과에 기록한다 (CLAUDE.md — 규칙은 rules/*.yaml,
# 규칙 버전을 결과에 기록한다. 이것은 탐지 규칙이 아니지만 같은 이유가 걸린다).
#
# **version 은 결과에 들어간다.** run_fold 가 run 블록에 `document_type_cues`
# 로 적는다. 아래 패턴을 한 줄이라도 고치면 version 을 올린다 — 같은
# `by_document_type` 라벨이 두 가지 유도를 가리키는 상태가 되고, 그 차이는
# 파일을 비교해도 보이지 않는다.
#
# **다중 라벨이고 분할(partition)이 아니다.** 한 문서가 여러 라벨을 받을 수 있고
# 아무 라벨도 받지 않을 수 있다. 라벨이 없는 상태에 이름을 주지 않는다 —
# naming.yaml 의 주석이 그 이유를 적는다.
#
# **대소문자를 구분한다.** 독일어 임상 텍스트에서 단서는 명사(대문자 시작)와
# 약어(전부 대문자)이고, 무시하면 `\bCT\b` 가 소문자 약어·영어 단어 조각에
# 걸린다. 그래서 letterspaced 표기(`O N K O L O G I E`)나 전부 대문자 머리글
# (`AMBULANZKARTE`)은 그 형태를 별도 패턴으로 적는다. 자동으로 커버되지 않는다.
#
# ─── de-grascco 의 단서가 DESIGN §7 의 측정과 어떻게 다른가 ──────
#
# DESIGN §7 과 docs/notes/corpus-observations.md §7.3 은 63 문서 전체에 대해
# 30 / 25 / 24 / 22 / 16 / 4 / 3 / 1 을 보고한다. 그 측정에 쓰인 정규식은
# **저장되지 않았다** — 노트는 단서를 산문으로 적었고 한 항목은
# `CT …Befund` 로 생략돼 있다. 그래서 이 파일은 그 측정의 재현이 아니라
# 같은 산문 기술로부터 다시 쓴 유도다. 두 가지가 동시에 달라졌다:
#
#   1. 패턴이 그 측정의 패턴과 바이트 동일하지 않다. 특히 `CT …Befund` 는
#      `\bCT\b` 가 됐고, 굴절형을 담으려고 어간으로 적은 항목이 여럿이다
#      (`[Hh]istolog`). 새 단서어를 더하지는 않았다 — 산문이 적은 단어들만 있다.
#   2. 2026-09-21 봉인 이후 이 저장소에서 읽을 수 있는 것은 51 문서다
#      (train 32 + dev 19). 12 문서는 sealed/ 에 있고 열지 않는다.
#
# 그러므로 여기서 나오는 수와 §7.3 의 수의 차이를 "봉인 때문" 과 "정규식이
# 달라서" 로 분해할 수 없다. 분해할 수 있다고 적지 않는다. **차이가 실재한다는
# 것은 증명된다** — 51 문서에 대한 radiology 가 34 이고, §7.3 의 63 문서에 대한
# 값은 30 이다. 봉인은 수를 줄일 수만 있으므로 이 패턴이 더 넓다. 나머지 일곱
# 라벨에 대해서는 방향조차 말할 수 없다.
#
# 재현 가능한 진술은 하나뿐이다 — 봉인 전 63 문서에 대한 §7.3 의 수는 그 시점의
# 측정으로 남고, 이 파일의 유도는 오늘 이후의 모든 보고에 쓰이는 유도다.
#
# 측정 결과는 docs/notes/corpus-observations.md §7.4 에 있다.

version: 1

corpora:

  # 여덟 라벨 전부가 여기 있다. 한 라벨이 이 코퍼스에서 문서를 하나도 잡지
  # 못하는 것은 정상이고 (§7.3 의 operation report 는 63 중 1), 보고 층이
  # documents 0 으로 적는다. 라벨을 빼면 "단서가 없었다" 와 "그 라벨을 묻지
  # 않았다" 가 구별되지 않는다.
  de-grascco:
    radiology:
      - '\bMRT\b'
      - '\bCT\b'
      - 'Computertomograph'
      - '[Ss]onographi'
      - '[Rr]öntgen'
      - '[Kk]ontrastmittel'
    pathology:
      - '[Hh]istolog'
      - '[Ii]mmunhistochem'
      - '[Mm]akroskopi'
    outpatient:
      - 'Ambulanz'
      - 'AMBULANZ'
      - 'ambulante[rn]? Vorstellung'
      - '[Ss]prechstunde'
    laboratory:
      - '[Ll]aborwerte'
      - '[Ll]eukozyten'
      - '\bCRP\b'
      - '[Hh]ämoglobin'
    progress_note:
      - '[Vv]erlaufsnotiz'
      - '[Vv]isite'
      - 'Verlauf:'
    discharge:
      - 'Entlassungsbericht'
      - 'Entlassungsbrief'
      - 'entlassen wir'
    tumour_board:
      - '[Tt]umorboard'
      - '[Tt]umorkonferenz'
    operation_report:
      - 'OP-Bericht'
      - '[Hh]autschnitt'
      - 'intraoperativ'
