# v24b 사전등록 — leave-one-corpus-out 태거 (T-loco · RT-loco)
#
# 2026-10-15. **LOCO 모델을 하나도 학습시키기 전**에 커밋된다. 근거와 논증은
# docs/DESIGN.md §13 에 있고 이 파일은 그 결정의 기계가 읽는 형태다 — 두 곳이
# 어긋나면 DESIGN.md 가 맞고 이 파일이 틀린 것이다.
#
# 어휘는 전부 config/naming.yaml 에서 온다. 이 파일은 어휘를 만들지 않는다
# (CLAUDE.md). 새 값이 필요했던 것은 **하나**이고 같은 커밋에서 naming.yaml 에
# 들어갔다: supervision 의 sup-transfer. detector 에 T-loco·RT-loco 를 만들지
# 않은 이유는 DESIGN §13.0 에 있다 — 두 arm 을 가르는 것은 가중치를 학습시킨
# 라벨이고 그것이 supervision 축의 주제이므로, detector 값을 만들면 한 축이
# 다른 축의 구분을 되풀이한다 (§12.0 이 porting 쪽에서 거절한 것과 같은 논증).

version: 1
registered: 2026-10-15
design_section: "docs/DESIGN.md §13"
builds_on: "experiments/hybrid_v24/registration.yaml"

# ─── 실험 행렬 ───────────────────────────────────────────────
# 두 arm × 다섯 코퍼스. 'T-loco' · 'RT-loco' 는 아래 좌표의 비형식 표기이고
# (v24 등록의 'RT-sel' 과 같은 용법), 결과 경로와 기록에는 축 값만 쓴다.
arms:
  T-loco:  {detector: T,  supervision: sup-transfer, porting: port-hybrid}
  RT-loco: {detector: RT, supervision: sup-transfer, porting: port-hybrid}
  # 비교 대상. 새로 돌리지 않고 발행된 기록을 읽는다.
  T:       {detector: T,  supervision: sup-human,    porting: port-hybrid}
  RT:      {detector: RT, supervision: sup-human,    porting: port-hybrid}
  R:       {detector: R,  supervision: sup-free,     porting: per_corpus_rules_arm}

corpora: [es-meddocan, de-grascco, es-carmen, en-deid, ko-surro]

# ─── 어느 R arm 의 규칙을 읽는가 ─────────────────────────────
# v24 등록과 **같은 선택**이다. 다른 arm 을 고르면 RT-loco 의 규칙 절반이
# in-domain RT 의 규칙 절반과 달라지고, 두 열의 차이가 태거 때문인지 규칙
# 때문인지 경로만 봐서는 알 수 없게 된다.
rules_arm:
  es-meddocan: port-loop
  de-grascco:  port-oneshot
  es-carmen:   port-oneshot
  en-deid:     port-oneshot
  ko-surro:    port-oneshot

# es-meddocan 의 한 가지 유보. DESIGN §13.3 — 표에 적고 고치지 않는다.
rules_caveat:
  es-meddocan: |
    port-loop iterated against dev with the Auditor's feedback to round 8, so this
    corpus's rules half saw es-meddocan dev gold. The R column and the RT-loco column
    for this corpus therefore have a rules half that is not label-free about the target,
    while the other four came from a single call with no dev feedback. Reported on the
    row; not averaged away.

# ─── 1.1 LOCO 태거 ───────────────────────────────────────────
tagger:
  model: xlm-roberta-base
  # 코퍼스 c 마다 c 를 뺀 나머지 **4개** train fold. v24 는 5개를 합쳤다.
  scheme: leave_one_corpus_out
  pooled_train_folds: 4
  n_models: 5
  labels:
    scheme: BIO
    source: "config/naming.yaml axes.phi_type"
    n_labels: 21
    excluded_types_dropped: true
  window:
    max_tokens: 512
    stride: 128
    overlap_resolution: per_token_max_probability
    offsets: character
  span_confidence: mean_token_probability
  training:
    # v24 와 **동일**. 바뀌는 인자는 어느 train fold 를 합치는가 하나다.
    identical_to: "experiments/hybrid_v24/registration.yaml tagger.training"
    optimizer: AdamW
    lr: 3.0e-5
    weight_decay: 0.01
    batch_size: 16
    grad_accumulation: 1
    max_epochs: 8
    warmup_ratio: 0.10
    lr_schedule: linear_decay
    device: mps
  # 시드 하나. 근거는 DESIGN §13.1 — §12.8 이 MPS 에서 시드가 모델을 식별하지
  # 않는다는 것을 확립했으므로 세 시드 × 다섯 holdout 은 이미 측정된 비결정성을
  # 5배 비용으로 다시 재는 것이고, v24 의 원고 결과가 시드 1 이므로 맞추면
  # in-domain 대 LOCO 비교가 한 인자 비교로 남는다.
  seeds: [1]
  primary_seed: 1
  epoch_selection:
    criterion: summed_dev_L_full
    split: dev
    # **held-out 코퍼스의 dev 는 선택에 들어가지 않는다.** 학습에 쓴 4개
    # 코퍼스의 dev 합산만 쓴다. 이것이 이 절의 요점이고, 기록에 필드로 남긴다 —
    # held-out dev 로 epoch 를 고른 LOCO 모델은 단계를 더한 in-domain 모델이다.
    corpora: training_four_only
    holdout_dev_used: false
    test_used: false
  provenance:
    layer: tagger
    rule_id: null
  weights:
    committed: false
    path_gitignored: true
    # 저장소 밖 백업. 공통 규칙.
    off_repo_backup: "~/agentic-deid-archive/v24b/"
    identity: sha256_of_model_safetensors

# ─── 1.2 병합 ────────────────────────────────────────────────
merge:
  # RT-loco 는 모든 type 에 UNION@0.5 로 **고정**이다. 선택기도 Arbiter 도
  # 돌리지 않는다 — 둘 다 대상 코퍼스의 dev 집계표를 읽고, 그것이 이 arm 이
  # 쓰지 않는다고 선언한 라벨이다 (DESIGN §13.2).
  policy: {policy: UNION, theta: 0.5}
  every_type: true
  selector_run: false
  arbiter_run: false
  llm_calls: 0

# ─── LLM 경로 ────────────────────────────────────────────────
# 이 절에는 LLM 호출이 없다. 0 은 측정이고 부재가 아니다.
llm:
  calls: 0
  provider: null
  model_id: null
  rationale: |
    No agent is consulted anywhere in v24b. The rules half is read from committed files,
    the tagger is trained, and the merge is the fixed RT baseline. The arms' metrics.json
    records llm_calls 0 for the same reason v24's T and RT arms do.

# ─── 1.3 사전등록 예측 ───────────────────────────────────────
predictions:
  P9:
    claim: "다섯 코퍼스 각각에서 dev 상보성의 rules only 비중이 v24 in-domain 보다 크다"
    direction: stated
    split: dev
    mode: fully_covered
    note: "약한 태거는 규칙만 찾은 gold 를 더 남긴다. 재미없는 이유로 맞을 가능성이 가장 큰 예측이고, 그 재미없는 이유가 §7 이 보는 기제다."
  P10:
    claim: "다섯 중 3개 이상에서 test L_full(RT-loco) < L_full(T-loco)"
    direction: stated
    split: test
  P11:
    claim: "T-loco 와 R 의 test L_full 차이"
    direction: none
    reporting: exploratory
    note: "방향을 예측하면 답이 저자가 의견을 가진 대상이 된다 (DESIGN §13.4)."

# ─── 1.4 봉인 개봉 ──────────────────────────────────────────
sealed:
  openings: 10                  # 2 arm × 5 코퍼스
  iteration: 1
  via: "src/eval/run_sealed_eval.py (DESIGN §12.7 hybrid branch)"
  preflight: "docs/notes/sealed-eval-preflight.md, 코퍼스·arm 마다"
  verify_dev_required: true
  # 막히면 우회하지 않는다. 거절은 결과로 보고된다 (DESIGN §12.6, §13.5).
  on_refusal: report_as_finding
  log_rows_after: 36            # 현재 26 + 10

# ─── 가이드라인 지표 ────────────────────────────────────────
guideline:
  # v24 와 같은 정의·같은 형식. 새 정의를 만들지 않는다.
  definitions_from: "experiments/hybrid_v24/registration.yaml guideline"
  computed_for: [T-loco dev, RT-loco dev, T-loco test, RT-loco test]
  consistency:
    # C 는 다시 재지 않는다. run_repeat 는 §12.7 이 추론 결정론성을 측정했고
    # (C = 1.000000), train_repeat 는 시드가 하나이므로 정의되지 않는다.
    run_repeat: not_recomputed
    train_repeat: not_applicable_single_seed

# ─── 게이트 ──────────────────────────────────────────────────
mutation_gate:
  # 공통 규칙 그대로. 전량은 원고 제출 뒤로 **연기**이고 면제가 아니다.
  # v24b 가 더하는 뮤테이션은 0 이고 TEST_FILES 멤버십도 바꾸지 않는다 —
  # 새 테스트는 TEST_FILES 밖 파일(tests/test_loco.py)에 들어간다.
  full_run: deferred_until_after_submission
  new_mutations_added: 0
  test_files_membership_changed: false
