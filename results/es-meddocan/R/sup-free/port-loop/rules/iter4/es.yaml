version: 4
lang: es
rules:
  - rule_id: title_dr_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Dr.", "Dra.", "DR.", "DRA.", "Dr ", "Dra "]
    then: capitalised_words
    score: 0.85
    comment: >
      Clinician names preceded by doctor title prefix.

  - rule_id: remitido_por_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Remitido por:"]
    then: capitalised_words
    gap: 5
    score: 0.85
    comment: >
      Names following remitido por label only with colon to reduce false positives.

  - rule_id: medico_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Médico:"]
    then: capitalised_words
    gap: 5
    score: 0.85
    comment: >
      Names following physician field label with colon.

  - rule_id: nombre_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Nombre:", "nombre:"]
    then: capitalised_words
    gap: 3
    score: 0.8
    comment: >
      Names following nombre field label with colon.

  - rule_id: apellidos_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Apellidos:"]
    then: capitalised_words
    gap: 3
    score: 0.85
    comment: >
      Names following apellidos field label.

  - rule_id: firmado_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Fdo.", "Fdo:", "Firmado:", "firmado:"]
    then: capitalised_words
    gap: 3
    score: 0.75
    comment: >
      Names following signature marker.

  - rule_id: responsable_clinico_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Responsable clínico:"]
    then: capitalised_words
    gap: 5
    score: 0.85
    comment: >
      Names following responsible clinician label.

  - rule_id: date_iso_pattern
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{4}[-/]\d{2}[-/]\d{2}\b'
    score: 0.9
    comment: >
      ISO format dates with separator.

  - rule_id: date_dmy_slash
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{1,2}/\d{1,2}/\d{2,4}\b'
    score: 0.85
    comment: >
      Day month year with slash separator.

  - rule_id: date_dmy_dash
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{1,2}-\d{1,2}-\d{2,4}\b'
    score: 0.85
    comment: >
      Day month year with dash separator.

  - rule_id: date_spanish_month_long
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{1,2}\s+de\s+(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+(?:de\s+)?\d{2,4}\b'
    flags: [ignorecase]
    score: 0.9
    comment: >
      Spanish long date format with month name.

  - rule_id: date_spanish_month_short
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{1,2}[-/](?:ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)[-/]\d{2,4}\b'
    flags: [ignorecase]
    score: 0.85
    comment: >
      Spanish date with abbreviated month.

  - rule_id: date_month_year_text
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+(?:de\s+)?\d{4}\b'
    flags: [ignorecase]
    score: 0.8
    comment: >
      Month name followed by year without day.

  - rule_id: date_month_year_short
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)(?:iembre|io|zo|il|o|bre)?[-/\s]+\d{2,4}\b'
    flags: [ignorecase]
    score: 0.75
    comment: >
      Month abbreviation or partial followed by year.

  - rule_id: date_month_dash_year
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)-\d{2,4}\b'
    flags: [ignorecase]
    score: 0.8
    comment: >
      Month name followed by dash and year.

  - rule_id: date_month_de_year
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Septiembre|Octubre|Noviembre|Diciembre)\s+(?:a\s+)?(?:Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Septiembre|Octubre|Noviembre|Diciembre\s+)?(?:del?\s+)?\d{4}\b'
    score: 0.8
    comment: >
      Capitalized month with del year pattern for clinical date ranges.

  - rule_id: date_viena_pattern
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:Viena|Vienna|Montreal|Paris|Lyon)\s+\d{4}\b'
    score: 0.7
    comment: >
      Conference or classification system with year.

  - rule_id: dni_checksum
    layer: regex_checksum
    phi_type: ID
    pattern: '\b\d{8}[A-Za-z]\b'
    checksum: dni_mod23
    score: 0.95
    comment: >
      Spanish national ID with checksum validation.

  - rule_id: nie_checksum
    layer: regex_checksum
    phi_type: ID
    pattern: '\b[XYZxyz]\d{7}[A-Za-z]\b'
    checksum: nie_mod23
    score: 0.95
    comment: >
      Foreigner ID with checksum validation.

  - rule_id: nuss_pattern
    layer: regex_checksum
    phi_type: ID
    pattern: '\b\d{2}\s?\d{8}\s?\d{2}\b'
    score: 0.75
    comment: >
      Social security number pattern with optional spaces.

  - rule_id: nhc_cue
    layer: context_cue
    phi_type: ID
    cue: ["NHC:", "Nº Historia:", "N.º Historia:", "Historia Clínica:", "HC:"]
    then: digits
    gap: 3
    score: 0.85
    comment: >
      Clinical history number following label.

  - rule_id: nass_cue
    layer: context_cue
    phi_type: ID
    cue: ["NASS:"]
    then: digits
    gap: 3
    score: 0.85
    comment: >
      Social security number following NASS label only.

  - rule_id: cipa_cue
    layer: context_cue
    phi_type: ID
    cue: ["CIPA:"]
    then: digits
    gap: 3
    score: 0.8
    comment: >
      Health card identifier following CIPA label.

  - rule_id: ncol_pattern
    layer: regex_checksum
    phi_type: ID
    pattern: '\bN[º.]?\s?Col[:\s]*\d{2}\s?\d{2}\s?\d{4,5}\b'
    flags: [ignorecase]
    score: 0.85
    comment: >
      Medical license number with NCol prefix and digit groups.

  - rule_id: email_pattern
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    score: 0.95
    comment: >
      Email address pattern.

  - rule_id: phone_spanish
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b(?:\+34[-.\s]?)?[679]\d{2}[-.\s]?\d{3}[-.\s]?\d{3}\b'
    score: 0.85
    comment: >
      Spanish mobile and landline phone pattern.

  - rule_id: phone_landline
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b(?:\+34[-.\s]?)?9\d{2}[-.\s]?\d{2}[-.\s]?\d{2}[-.\s]?\d{2}\b'
    score: 0.8
    comment: >
      Spanish landline phone pattern.

  - rule_id: telefono_cue
    layer: context_cue
    phi_type: CONTACT
    cue: ["Tel.:", "Teléfono:", "Tfno:", "Tfno.:", "Móvil:"]
    then: digits
    gap: 5
    score: 0.85
    comment: >
      Phone number following telephone label.

  - rule_id: fax_cue
    layer: context_cue
    phi_type: CONTACT
    cue: ["Fax:", "FAX:"]
    then: digits
    gap: 3
    score: 0.85
    comment: >
      Fax number following fax label.

  - rule_id: correo_cue
    layer: context_cue
    phi_type: CONTACT
    cue: ["Correo electrónico:", "E-mail:", "Email:", "e-mail:"]
    then: rest_of_line
    gap: 3
    score: 0.85
    comment: >
      Email following contact label.

  - rule_id: calle_address_prefix
    layer: context_cue
    phi_type: LOCATION_STREET
    cue: ["C/", "c/", "Calle ", "calle ", "Avda.", "Avda ", "Avenida ", "Av. ", "Pza.", "Plaza ", "Paseo ", "Pº ", "Ctra.", "Ctra ", "Carretera "]
    then: capitalised_words
    gap: 3
    score: 0.8
    comment: >
      Street addresses following street type prefix.

  - rule_id: domicilio_cue
    layer: context_cue
    phi_type: LOCATION_STREET
    cue: ["Domicilio:", "Dirección:", "Domiciliado en", "domiciliado en", "residente en", "Residente en"]
    then: rest_of_line
    gap: 3
    score: 0.75
    comment: >
      Full address following address label.

  - rule_id: cp_postal_code
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\bCP[:\s]*\d{5}\b'
    score: 0.85
    comment: >
      Spanish postal code with CP prefix.

  - rule_id: localidad_cue
    layer: context_cue
    phi_type: LOCATION_AREA
    cue: ["Localidad/ Provincia:", "Localidad/Provincia:", "Localidad:", "Provincia:"]
    then: capitalised_words
    gap: 3
    score: 0.85
    comment: >
      City or province following localidad label.

  - rule_id: postal_code_standalone
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\b\d{5}\b(?=\s+[A-ZÁÉÍÓÚÑ])'
    score: 0.7
    comment: >
      Postal code followed by city name.

  - rule_id: postal_code_city_pattern
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\b\d{5}\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[a-zA-ZáéíóúñÁÉÍÓÚÑ]+)*'
    score: 0.8
    comment: >
      Postal code followed by city name as single match.

  - rule_id: parenthetical_location
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\((?:Madrid|Barcelona|Valencia|Sevilla|Málaga|Zaragoza|Bilbao|Alicante|Cantabria|Girona|Toledo|Cáceres|A Coruña|Albacete|Salamanca)\)'
    score: 0.8
    comment: >
      City or region name in parentheses.

  - rule_id: pais_espana
    layer: context_cue
    phi_type: LOCATION_AREA
    cue: ["País:"]
    then: capitalised_word
    gap: 3
    score: 0.8
    comment: >
      Country following Pais label.

  - rule_id: edad_pattern
    layer: regex_checksum
    phi_type: AGE
    pattern: '\bEdad[:\s]*\d{1,3}\s*años?\b'
    flags: [ignorecase]
    score: 0.85
    comment: >
      Age following Edad label with years.

  - rule_id: age_years_pattern
    layer: regex_checksum
    phi_type: AGE
    pattern: '(?<!\blos\s)(?<!\ba\slos\s)\b\d{1,2}\s+años\b(?!\s+de\s+(?:evolución|seguimiento|tratamiento|intervención|enfermedad))'
    flags: [ignorecase]
    score: 0.8
    comment: >
      Age in years format excluding time durations and follow-up periods.

  - rule_id: age_months_infant
    layer: regex_checksum
    phi_type: AGE
    pattern: '\b\d{1,2}\s+(?:Mes(?:es)?|mes(?:es)?)\s+(?:y\s+medio\s+)?(?:de\s+(?:edad|vida|nacido))?\b'
    flags: [ignorecase]
    score: 0.75
    comment: >
      Infant age in months.

  - rule_id: hospital_nombre_gazetteer
    layer: gazetteer
    phi_type: ORGANISATION
    terms: ["Hospital Ramón y Cajal", "Hospital de Manises", "Hospital Gregorio Marañón", "Hospital General Universitario Gregorio Marañón", "Hospital Clínico Universitario San Cecilio", "Fundación Hospital de Calahorra", "Hospital General Universitario", "Hospital Universitario Miguel Servet", "Hospital Universitario Marqués de Valdecilla", "Hospital García Orcoyen", "Hospital José Ramón Vidal", "Hospital Clínic", "Hospital Regional Carlos Haya", "Hospital Universitario Doctor Peset", "Complejo Hospitalario Universitario de Albacete", "Hospital Clínico San Carlos", "Hospital General Universitario de Alicante", "Hospital Virgen Del Puerto", "Hospital Universitario de Guadalajara", "Hospital Universitario de Salamanca", "Hospital Universitario Puerta de Hierro"]
    score: 0.9
    comment: >
      Known hospital names as gazetteer entries.

  - rule_id: servicio_de_cue
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Servicio de"]
    then: capitalised_words
    gap: 3
    score: 0.6
    comment: >
      Department or service names following Servicio de with lower score.

  - rule_id: profesion_cue
    layer: context_cue
    phi_type: PROFESSION
    cue: ["Profesión:", "profesión:", "Ocupación:", "ocupación:", "Trabaja como", "trabaja como", "de profesión"]
    then: word
    gap: 5
    score: 0.7
    comment: >
      Profession following occupation label.

  - rule_id: city_name_gazetteer
    layer: gazetteer
    phi_type: LOCATION_AREA
    terms: ["Madrid", "Barcelona", "Valencia", "Sevilla", "Málaga", "Zaragoza", "Bilbao", "Alicante", "Cantabria", "Girona", "Toledo", "Cáceres", "Valladolid", "Salamanca", "Albacete", "Majadahonda", "Torrelodones", "Alcalá de Guadaíra", "Gambia"]
    score: 0.7
    comment: >
      Spanish city and region names as gazetteer.