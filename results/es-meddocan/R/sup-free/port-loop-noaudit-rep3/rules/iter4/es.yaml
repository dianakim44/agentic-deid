version: 4
lang: es
rules:
  - rule_id: title_dr_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Dr.", "Dra.", "DR.", "DRA.", "Dr ", "Dra "]
    then: capitalised_words
    score: 0.9
    comment: >
      Clinician names preceded by doctor title prefix.

  - rule_id: title_licenciado_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Lic.", "Lcdo.", "Lcda."]
    then: capitalised_words
    score: 0.8
    comment: >
      Names preceded by licenciado prefix common in clinical notes.

  - rule_id: patient_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Paciente:", "PACIENTE:", "Nombre:", "NOMBRE:", "Nombre del paciente:"]
    then: capitalised_words
    score: 0.9
    comment: >
      Patient name following explicit label.

  - rule_id: apellidos_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Apellidos:", "APELLIDOS:", "Apellido:"]
    then: capitalised_words
    score: 0.9
    comment: >
      Surname following apellidos label.

  - rule_id: remitido_por_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Remitido por:", "REMITIDO POR:", "Remitido por"]
    then: capitalised_words
    gap: 5
    score: 0.85
    comment: >
      Referring physician name following remitido por label.

  - rule_id: medico_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Médico:", "MÉDICO:", "Medico:"]
    then: capitalised_words
    score: 0.85
    comment: >
      Physician name following medico label.

  - rule_id: responsable_clinico_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Responsable clínico:", "Responsable clinico:", "RESPONSABLE CLÍNICO:"]
    then: capitalised_words
    gap: 10
    score: 0.85
    comment: >
      Responsible clinician name following label.

  - rule_id: antecedentes_name_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Antecedentes:"]
    then: capitalised_word
    gap: 3
    score: 0.7
    comment: >
      Patient first name following antecedentes label in narrative.

  - rule_id: birthdate_cue
    layer: context_cue
    phi_type: DATE
    cue: ["Fecha de nacimiento:", "F. nacimiento:", "F.Nac:", "FN:", "Nacido el", "Nacida el", "nacido el", "nacida el"]
    then: digits
    score: 0.9
    comment: >
      Birth date following date of birth label.

  - rule_id: discharge_date_cue
    layer: context_cue
    phi_type: DATE
    cue: ["Fecha de alta:", "Alta el", "Dado de alta el", "Dada de alta el"]
    then: digits
    score: 0.85
    comment: >
      Discharge date following discharge label.

  - rule_id: report_date_cue
    layer: context_cue
    phi_type: DATE
    cue: ["Fecha del informe:", "Fecha informe:", "Fecha:"]
    then: digits
    score: 0.8
    comment: >
      Report date following date label.

  - rule_id: date_month_name_pattern
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{1,2}\s*(?:de\s+)?(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s*(?:de\s+|del\s+)?\d{4}\b'
    flags: [ignorecase]
    score: 0.85
    comment: >
      Dates with Spanish month names like 10 de marzo de 2006.

  - rule_id: date_slash_pattern
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{1,2}/\d{1,2}/\d{4}\b'
    score: 0.7
    comment: >
      Dates in dd/mm/yyyy format.

  - rule_id: date_month_word_pattern
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+(?:de\s+)?\d{4}\b'
    flags: [ignorecase]
    score: 0.75
    comment: >
      Month and year pattern like abril 2002.

  - rule_id: date_year_standalone
    layer: regex_checksum
    phi_type: DATE
    pattern: '(?:desde|hasta|en|año)\s+(\d{4})\b'
    flags: [ignorecase]
    score: 0.6
    comment: >
      Standalone years with temporal preposition.

  - rule_id: dni_checksum
    layer: regex_checksum
    phi_type: ID
    pattern: '\b\d{8}[A-Za-z]\b'
    checksum: dni_mod23
    score: 0.95
    comment: >
      Spanish national identifier with mod23 letter checksum.

  - rule_id: nie_checksum
    layer: regex_checksum
    phi_type: ID
    pattern: '\b[XYZxyz]\d{7}[A-Za-z]\b'
    checksum: nie_mod23
    score: 0.95
    comment: >
      Foreign resident identifier with mod23 checksum.

  - rule_id: medical_record_number
    layer: regex_checksum
    phi_type: ID
    pattern: '\b(?:NHC|HC|Nº?\s*Historia)[:\s]*\d{4,10}\b'
    flags: [ignorecase]
    score: 0.85
    comment: >
      Medical record number with common prefixes.

  - rule_id: nass_pattern
    layer: regex_checksum
    phi_type: ID
    pattern: '\b\d{2}\s+\d{8}\s+\d{2}\b'
    score: 0.85
    comment: >
      Social security number NASS format with spaces.

  - rule_id: nass_cue
    layer: context_cue
    phi_type: ID
    cue: ["NASS:"]
    then: '\d{2}\s+\d{8}\s+\d{2}'
    gap: 3
    score: 0.9
    comment: >
      Social security number following NASS label with strict format.

  - rule_id: ncol_pattern
    layer: regex_checksum
    phi_type: ID
    pattern: '\bNºCol[:\s]*\d{2}\s+\d{2}\s+\d{4,6}\b'
    score: 0.9
    comment: >
      Physician college number pattern.

  - rule_id: ncol_nospace_pattern
    layer: regex_checksum
    phi_type: ID
    pattern: '\bNºCol[:\s]*\d{2}\s+\d{2}\b'
    score: 0.85
    comment: >
      Physician college number shorter format.

  - rule_id: episodio_cue
    layer: context_cue
    phi_type: ID
    cue: ["Episodio:", "EPISODIO:"]
    then: digits
    score: 0.85
    comment: >
      Episode identifier following label.

  - rule_id: phone_number
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b(?:\+34\s?)?[6789]\d{2}[\s.-]?\d{3}[\s.-]?\d{3}\b'
    score: 0.85
    comment: >
      Spanish phone numbers mobile and landline with optional country code.

  - rule_id: phone_cue
    layer: context_cue
    phi_type: CONTACT
    cue: ["Tel:", "Tel.:", "Teléfono:", "Tfno:", "Tfno.:", "Móvil:", "Fax:", "Tfno.", "Tel.:"]
    then: digits
    score: 0.9
    comment: >
      Phone or fax number following telephone label.

  - rule_id: ncol_contact_cue
    layer: context_cue
    phi_type: CONTACT
    cue: ["NºCol:"]
    then: digits
    gap: 3
    score: 0.8
    comment: >
      College number as contact info following label.

  - rule_id: email_pattern
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    score: 0.9
    comment: >
      Email addresses standard pattern.

  - rule_id: age_years_suffix
    layer: regex_checksum
    phi_type: AGE
    pattern: '\b\d{1,3}\s*años(?:\s+de\s+edad)?\b'
    flags: [ignorecase]
    score: 0.85
    comment: >
      Age in years with anos suffix.

  - rule_id: age_months_suffix
    layer: regex_checksum
    phi_type: AGE
    pattern: '\b\d{1,2}\s*meses(?:\s+de\s+(?:edad|vida))?\b'
    flags: [ignorecase]
    score: 0.85
    comment: >
      Age in months with meses suffix.

  - rule_id: postal_code_cue
    layer: context_cue
    phi_type: LOCATION_AREA
    cue: ["CP:"]
    then: '\d{5}'
    gap: 3
    score: 0.9
    comment: >
      Postal code following CP label with strict 5 digit match.

  - rule_id: localidad_cue
    layer: context_cue
    phi_type: LOCATION_AREA
    cue: ["Localidad/ Provincia:", "Localidad/Provincia:", "Localidad:", "Provincia:"]
    then: capitalised_words
    score: 0.8
    comment: >
      City or province following localidad label.

  - rule_id: postal_code_pattern
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\b(?:0[1-9]|[1-4]\d|5[0-2])\d{3}\b'
    score: 0.5
    comment: >
      Spanish postal codes 5 digits starting with valid province codes.

  - rule_id: city_after_postal
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\b(?:0[1-9]|[1-4]\d|5[0-2])\d{3}\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:[-\s](?:de\s+(?:la\s+)?|las?\s+)?[A-ZÁÉÍÓÚÑ]?[a-záéíóúñ]+)*'
    score: 0.7
    comment: >
      City name following postal code including compound names.

  - rule_id: city_parenthetical
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+[A-ZÁÉÍÓÚÑ]?[a-záéíóúñ]+)?\)'
    score: 0.5
    comment: >
      City or province names in parentheses.

  - rule_id: estado_mexico_pattern
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\b(?:Estado\s+de\s+)?[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+(?:\s+de\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?\.\s*(?:México|Chile|España)'
    score: 0.7
    comment: >
      State or region followed by country name.

  - rule_id: colonia_cue
    layer: context_cue
    phi_type: LOCATION_AREA
    cue: ["Colonia"]
    then: capitalised_words
    gap: 3
    score: 0.75
    comment: >
      Mexican neighborhood colonia names.

  - rule_id: street_calle_cue
    layer: context_cue
    phi_type: LOCATION_STREET
    cue: ["C/", "c/", "Calle", "calle", "CALLE", "Avda.", "Avda", "Avenida", "Pza.", "Plaza", "Paseo", "Ronda", "Camino", "Av/", "Travessera", "Av.", "Av "]
    then: capitalised_words
    gap: 5
    score: 0.8
    comment: >
      Street address following street type indicator.

  - rule_id: address_cue
    layer: context_cue
    phi_type: LOCATION_STREET
    cue: ["Domicilio:", "Dirección:", "Direccion:", "DOMICILIO:", "DIRECCIÓN:"]
    then: rest_of_line
    score: 0.85
    comment: >
      Full address following address label.

  - rule_id: ctra_street_cue
    layer: context_cue
    phi_type: LOCATION_STREET
    cue: ["Ctra.", "Carretera", "Ctra"]
    then: rest_of_line
    gap: 5
    score: 0.8
    comment: >
      Road or highway address captures full line.

  - rule_id: street_full_pattern
    layer: regex_checksum
    phi_type: LOCATION_STREET
    pattern: '(?:C/|Calle|Avda\.?|Avenida|Paseo|Plaza|Pza\.?|Av\.)\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñA-ZÁÉÍÓÚÑ\s]+,?\s*(?:\d+|s/n)(?:\s*[-,]\s*\d+)?'
    flags: [unicode]
    score: 0.75
    comment: >
      Full street address with number pattern.

  - rule_id: signature_street_pattern
    layer: regex_checksum
    phi_type: LOCATION_STREET
    pattern: '(?:Avda?\.|Avenida|C/|Calle|Paseo)\s+[A-ZÁÉÍÓÚÑ][^,\n]{3,40},\s*\d+(?:\s*[-–]\s*\d+)?(?:\s+puerta\s+\d+)?'
    flags: [unicode]
    score: 0.8
    comment: >
      Street addresses in signature blocks with number and optional unit.

  - rule_id: hospital_org_pattern
    layer: regex_checksum
    phi_type: ORGANISATION
    pattern: 'Hospital\s+(?:Universitario\s+)?(?:de\s+(?:la\s+)?)?[A-ZÁÉÍÓÚÑ][a-záéíóúñA-ZÁÉÍÓÚÑ\s]+(?:\s+y\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)?'
    flags: [unicode]
    score: 0.8
    comment: >
      Hospital names with various prefixes.

  - rule_id: instituto_org_pattern
    layer: regex_checksum
    phi_type: ORGANISATION
    pattern: 'Instituto\s+(?:Universitario\s+)?(?:de\s+)?[A-ZÁÉÍÓÚÑ][a-záéíóúñA-ZÁÉÍÓÚÑ\s]+(?:\s+Aplicad[ao])?'
    flags: [unicode]
    score: 0.75
    comment: >
      Institute names including university institutes.

  - rule_id: servicio_org_pattern
    layer: regex_checksum
    phi_type: ORGANISATION
    pattern: 'Servicio\s+de\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñA-ZÁÉÍÓÚÑ\s]+(?:,\s+Hospital[^,\n]+)?'
    flags: [unicode]
    score: 0.7
    comment: >
      Clinical service names optionally followed by hospital.

  - rule_id: clinica_prefix
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Clínica", "Clinica", "CLÍNICA"]
    then: capitalised_words
    gap: 3
    score: 0.75
    comment: >
      Clinic names following clinica prefix.

  - rule_id: centro_salud_prefix
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Centro de Salud", "C.S.", "CS "]
    then: capitalised_words
    gap: 3
    score: 0.75
    comment: >
      Health center names.

  - rule_id: fundacion_prefix
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Fundación", "Fundacion"]
    then: capitalised_words
    gap: 5
    score: 0.75
    comment: >
      Foundation names.

  - rule_id: unidad_org_pattern
    layer: regex_checksum
    phi_type: ORGANISATION
    pattern: 'Unidad\s+de\s+[A-ZÁÉÍÓÚÑ][a-záéíóúñA-ZÁÉÍÓÚÑ\s]+(?:\.\s+Servicio)?'
    flags: [unicode]
    score: 0.7
    comment: >
      Clinical unit names.

  - rule_id: universidad_org_pattern
    layer: regex_checksum
    phi_type: ORGANISATION
    pattern: 'Universidad\s+(?:Central\s+de\s+)?[A-ZÁÉÍÓÚÑ][a-záéíóúñA-ZÁÉÍÓÚÑ\s]+'
    flags: [unicode]
    score: 0.75
    comment: >
      University names.

  - rule_id: manufacturer_pattern
    layer: regex_checksum
    phi_type: ORGANISATION
    pattern: '\([A-Z][A-Za-z]+®?,\s*[A-Z][a-z]+,\s*[A-Z][a-z]+(?:,\s*[A-Z]{2,3}\.?[A-Z]{0,2}\.?)?\)'
    score: 0.65
    comment: >
      Manufacturer references in parentheses with trademark.

  - rule_id: manufacturer_inline_pattern
    layer: regex_checksum
    phi_type: ORGANISATION
    pattern: '\([A-Z][A-Za-z]+®?\.\s+[A-Z][a-z]+\.\s+[A-Za-z]+(?:,\s+[A-Z][a-z]+)?\)'
    score: 0.65
    comment: >
      Equipment manufacturer references with periods.

  - rule_id: profession_cue
    layer: context_cue
    phi_type: PROFESSION
    cue: ["Profesión:", "Profesion:", "PROFESIÓN:", "Ocupación:", "Ocupacion:", "Trabaja como", "trabaja como", "Trabajo:", "trabajo:", "ocupación:"]
    then: capitalised_word
    gap: 3
    score: 0.8
    comment: >
      Profession or occupation following label.

  - rule_id: profession_occupation_pattern
    layer: regex_checksum
    phi_type: PROFESSION
    pattern: ',\s+(carpintero|albañil|electricista|fontanero|mecánico|conductor|agricultor|pescador|minero|obrero|empleado|funcionario|comerciante|vendedor|cocinero|camarero|peluquero|sastre|zapatero|pintor|jardinero)\b'
    flags: [ignorecase]
    score: 0.75
    comment: >
      Common manual occupations after comma in narrative.

  - rule_id: profession_hogar
    layer: gazetteer
    phi_type: PROFESSION
    terms: ["hogar", "sus labores", "ama de casa", "jubilado", "jubilada", "pensionista"]
    score: 0.75
    comment: >
      Common profession and occupation terms including homemaker.