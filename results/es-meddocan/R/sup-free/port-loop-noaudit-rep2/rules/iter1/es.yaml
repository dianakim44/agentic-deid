version: 1
lang: es
rules:
  - rule_id: titulo_dr
    layer: context_cue
    phi_type: NAME
    cue: ["Dr.", "Dr ", "DR.", "DR "]
    then: capitalised_words
    comment: >
      Clinician name following doctor title prefix masculine form.

  - rule_id: titulo_dra
    layer: context_cue
    phi_type: NAME
    cue: ["Dra.", "Dra ", "DRA.", "DRA "]
    then: capitalised_words
    comment: >
      Clinician name following doctor title prefix feminine form.

  - rule_id: titulo_don
    layer: context_cue
    phi_type: NAME
    cue: ["D.", "D ", "Dña.", "Dña ", "Doña ", "Don "]
    then: capitalised_words
    comment: >
      Name following Spanish honorific prefix don or doña.

  - rule_id: paciente_cue
    layer: context_cue
    phi_type: NAME
    cue: ["paciente ", "Paciente ", "PACIENTE "]
    then: capitalised_words
    comment: >
      Patient name following paciente keyword.

  - rule_id: nombre_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Nombre: ", "NOMBRE: ", "Nombre : "]
    then: capitalised_words
    comment: >
      Name following explicit nombre label in clinical forms.

  - rule_id: fecha_nacimiento_cue
    layer: context_cue
    phi_type: DATE
    cue: ["Fecha de nacimiento:", "Fecha de Nacimiento:", "F. nacimiento:", "FN:", "Nacido el ", "Nacida el ", "nacido el ", "nacida el ", "fecha nacimiento:"]
    then: digits
    comment: >
      Date of birth following birth date label.

  - rule_id: fecha_ingreso_cue
    layer: context_cue
    phi_type: DATE
    cue: ["Fecha de ingreso:", "Fecha ingreso:", "Ingresado el ", "ingresado el "]
    then: digits
    comment: >
      Admission date following ingreso label.

  - rule_id: fecha_alta_cue
    layer: context_cue
    phi_type: DATE
    cue: ["Fecha de alta:", "Fecha alta:", "Alta el "]
    then: digits
    comment: >
      Discharge date following alta label.

  - rule_id: dni_checksum
    layer: regex_checksum
    phi_type: ID
    pattern: '\b\d{8}[A-Za-z]\b'
    checksum: dni_mod23
    comment: >
      Spanish national ID number with mod23 letter validation.

  - rule_id: nie_checksum
    layer: regex_checksum
    phi_type: ID
    pattern: '\b[XYZxyz]\d{7}[A-Za-z]\b'
    checksum: nie_mod23
    comment: >
      Spanish foreigner ID number with mod23 letter validation.

  - rule_id: nss_pattern
    layer: regex_checksum
    phi_type: ID
    pattern: '\b\d{2}[/-]?\d{8}[/-]?\d{2}\b'
    comment: >
      Spanish social security number pattern twelve digits with optional separators.

  - rule_id: nhc_cue
    layer: context_cue
    phi_type: ID
    cue: ["NHC:", "NHC :", "N.H.C.:", "Nº Historia:", "Historia Clínica:", "HC:", "Nº HC:"]
    then: digits
    comment: >
      Clinical record number following NHC or historia label.

  - rule_id: nass_cue
    layer: context_cue
    phi_type: ID
    cue: ["NASS:", "N.A.S.S.:", "Nº SS:", "NSS:"]
    then: digits
    comment: >
      Social security number following NASS label.

  - rule_id: telefono_cue
    layer: context_cue
    phi_type: CONTACT
    cue: ["Tel:", "Tel.:", "Teléfono:", "Tfno:", "Tfno.:", "Telf:", "Telf.:"]
    then: digits
    comment: >
      Phone number following telephone label.

  - rule_id: telefono_pattern
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b[69]\d{8}\b'
    comment: >
      Spanish mobile or landline phone nine digits starting with 6 or 9.

  - rule_id: email_pattern
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    comment: >
      Email address pattern.

  - rule_id: calle_cue
    layer: context_cue
    phi_type: LOCATION_STREET
    cue: ["C/", "C/ ", "Calle ", "calle ", "CALLE ", "Avda.", "Avda ", "Avenida ", "Pza.", "Plaza ", "Paseo "]
    then: capitalised_words
    comment: >
      Street address following street type prefix.

  - rule_id: domicilio_cue
    layer: context_cue
    phi_type: LOCATION_STREET
    cue: ["Domicilio:", "Dirección:", "Direccion:"]
    then: rest_of_line
    comment: >
      Full address following domicilio or direccion label.

  - rule_id: cp_cue
    layer: context_cue
    phi_type: LOCATION_AREA
    cue: ["CP:", "CP ", "C.P.:", "C.P. ", "Código Postal:"]
    then: number
    comment: >
      Postal code following CP label.

  - rule_id: cp_pattern
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\b\d{5}\b'
    comment: >
      Spanish five digit postal code standalone pattern.

  - rule_id: localidad_cue
    layer: context_cue
    phi_type: LOCATION_AREA
    cue: ["Localidad:", "Población:", "Ciudad:"]
    then: capitalised_words
    comment: >
      City or town name following locality label.

  - rule_id: edad_cue
    layer: context_cue
    phi_type: AGE
    cue: ["años de edad", "años, ", " años,", " años."]
    then: number
    gap: 0
    comment: >
      Age in years appearing before años keyword.

  - rule_id: edad_pattern
    layer: regex_checksum
    phi_type: AGE
    pattern: '\b\d{1,3}\s*años\b'
    flags: [ignorecase]
    comment: >
      Age pattern number followed by años.

  - rule_id: profesion_cue
    layer: context_cue
    phi_type: PROFESSION
    cue: ["Profesión:", "Profesion:", "Ocupación:", "Trabajo:"]
    then: capitalised_words
    comment: >
      Profession following occupation label.

  - rule_id: hospital_gazetteer
    layer: gazetteer
    phi_type: ORGANISATION
    terms: ["Hospital", "Hospital Universitario", "Hospital General", "Hospital Clínico", "Centro de Salud", "C.S.", "Clínica", "Consultorio", "Ambulatorio", "Centro Médico", "Centro de Especialidades"]
    comment: >
      Common hospital and healthcare facility type terms.

  - rule_id: servicio_cue
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Servicio de ", "Servicio:", "Unidad de ", "Departamento de "]
    then: capitalised_words
    comment: >
      Hospital service or department name following servicio label.