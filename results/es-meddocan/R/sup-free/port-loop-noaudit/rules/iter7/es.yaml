version: 7
lang: es
rules:
  - rule_id: title_dr_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Dr.", "Dra.", "DR.", "DRA."]
    then: capitalised_words
    comment: >
      Clinician name preceded by doctor title prefix. Removed "Dr " to reduce false positives.

  - rule_id: patient_label
    layer: context_cue
    phi_type: NAME
    cue: ["Paciente:", "PACIENTE:", "Nombre:", "NOMBRE:", "Nombre del paciente:", "Nombre y apellidos:"]
    then: capitalised_words
    comment: >
      Patient name after explicit label in clinical header.

  - rule_id: signed_by_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Fdo:", "Fdo.", "Firmado:", "Firmado por:"]
    then: capitalised_words
    comment: >
      Signature line for clinician name.

  - rule_id: apellidos_label
    layer: context_cue
    phi_type: NAME
    cue: ["Apellidos:", "APELLIDOS:"]
    then: capitalised_words
    comment: >
      Surname after explicit label in clinical header.

  - rule_id: medico_label
    layer: context_cue
    phi_type: NAME
    cue: ["Médico:", "MÉDICO:", "Médico:"]
    then: capitalised_words
    gap: 2
    comment: >
      Physician name after explicit label.

  - rule_id: responsible_clinician_label
    layer: context_cue
    phi_type: NAME
    cue: ["Responsable clínico:"]
    then: capitalised_words
    gap: 5
    comment: >
      Clinician name after responsible label.

  - rule_id: remitido_por_label
    layer: context_cue
    phi_type: NAME
    cue: ["Remitido por:"]
    then: capitalised_words
    gap: 5
    comment: >
      Clinician name after referred by label.

  - rule_id: emitido_por_label
    layer: context_cue
    phi_type: NAME
    cue: ["Emitido por:"]
    then: capitalised_words
    gap: 5
    comment: >
      Clinician name after emitted by label.

  - rule_id: nhc_label
    layer: context_cue
    phi_type: ID
    cue: ["NHC:", "N.H.C.:", "Nº Historia:", "Nº Historia Clínica:", "Historia Clínica:", "HC:"]
    then: digits
    comment: >
      Clinical history number after label.

  - rule_id: nhc_prefix
    layer: regex_checksum
    phi_type: ID
    pattern: '\bnhc-\d+\b'
    flags: [ignorecase]
    comment: >
      Clinical history number with nhc- prefix.

  - rule_id: nass_label
    layer: context_cue
    phi_type: ID
    cue: ["NASS:", "N.A.S.S.:", "NSS:"]
    then: digits
    gap: 1
    comment: >
      Social security affiliation number after NASS label.

  - rule_id: nass_pattern
    layer: regex_checksum
    phi_type: ID
    pattern: '\b\d{2}[\s-]+\d{8}[\s-]+\d{2}\b'
    comment: >
      Spanish social security number pattern NN NNNNNNNN NN with spaces or dashes.

  - rule_id: episodio_label
    layer: context_cue
    phi_type: ID
    cue: ["Episodio:", "EPISODIO:"]
    then: digits
    comment: >
      Episode number after explicit label.

  - rule_id: cipa_label
    layer: context_cue
    phi_type: ID
    cue: ["CIPA:"]
    then: digits
    comment: >
      CIPA identifier after label.

  - rule_id: dni_checksum
    layer: regex_checksum
    phi_type: ID
    pattern: '\b\d{8}[A-Za-z]\b'
    checksum: dni_mod23
    comment: >
      Spanish national ID with mod23 letter validation.

  - rule_id: nie_checksum
    layer: regex_checksum
    phi_type: ID
    pattern: '\b[XYZxyz]\d{7}[A-Za-z]\b'
    checksum: nie_mod23
    comment: >
      Foreign resident ID with mod23 letter validation.

  - rule_id: ncol_label
    layer: context_cue
    phi_type: ID
    cue: ["NºCol:", "NºCol.:", "Nº Col:", "N.º Col:", "NºCol:"]
    then: digits
    gap: 2
    comment: >
      Medical collegiate registration number after label.

  - rule_id: phone_spain
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b(?:\+34[\s.-]?)?[6789]\d{2}[\s.-]?\d{3}[\s.-]?\d{3}\b'
    comment: >
      Spanish phone number with optional country code.

  - rule_id: phone_intl_prefix
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b34-\d{9}\b'
    comment: >
      Phone with country code prefix 34-NNNNNNNNN.

  - rule_id: phone_tfno_label
    layer: context_cue
    phi_type: CONTACT
    cue: ["Tfno.", "Tfno:", "Tel.:", "Tel:", "Teléfono:", "Tel.:", "Tfno."]
    then: digits
    gap: 5
    comment: >
      Phone number after telephone label.

  - rule_id: email_pattern
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    flags: [ignorecase]
    comment: >
      Email address pattern.

  - rule_id: fax_label
    layer: context_cue
    phi_type: CONTACT
    cue: ["Fax:", "Fax:"]
    then: digits
    gap: 5
    comment: >
      Fax number after Fax label.

  - rule_id: date_dmy_slash
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:0?[1-9]|[12]\d|3[01])[/](?:0?[1-9]|1[0-2])[/](?:19|20)?\d{2}\b'
    comment: >
      Date in dd/mm/yy or dd/mm/yyyy format.

  - rule_id: date_dmy_dash
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:0?[1-9]|[12]\d|3[01])[-](?:0?[1-9]|1[0-2])[-](?:19|20)?\d{2}\b'
    comment: >
      Date in dd-mm-yy or dd-mm-yyyy format.

  - rule_id: date_dmy_dot
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:0?[1-9]|[12]\d|3[01])[.](?:0?[1-9]|1[0-2])[.](?:19|20)?\d{2}\b'
    comment: >
      Date in dd.mm.yy or dd.mm.yyyy format.

  - rule_id: date_spanish_month_full
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:0?[1-9]|[12]\d|3[01])\s+de\s+(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)(?:\s+(?:de\s+)?(?:19|20)\d{2})?\b'
    flags: [ignorecase]
    comment: >
      Date with Spanish month name requiring day number before de.

  - rule_id: date_abbrev_month
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:0?[1-9]|[12]\d|3[01])[-/\s](?:ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)[-/\s](?:19|20)?\d{2}\b'
    flags: [ignorecase]
    comment: >
      Date with abbreviated Spanish month.

  - rule_id: date_month_year_full
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\s+(?:de\s+)?(?:19|20)\d{2}\b'
    flags: [ignorecase]
    comment: >
      Month name followed by four digit year like enero de 2016.

  - rule_id: date_year_standalone
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:19|20)\d{2}\b'
    comment: >
      Four digit year standing alone.

  - rule_id: street_calle_cue
    layer: context_cue
    phi_type: LOCATION_STREET
    cue: ["C/", "c/", "C/.", "Calle ", "CALLE ", "Avda.", "Avda ", "Avenida ", "Pza.", "Plaza ", "Paseo ", "Pº ", "Carrer ", "Travessera ", "Av/", "Pso.", "Pso "]
    then: rest_of_line
    gap: 1
    comment: >
      Street address after street type abbreviation. Removed Ctra and Carretera.

  - rule_id: address_label
    layer: context_cue
    phi_type: LOCATION_STREET
    cue: ["Domicilio:", "Dirección:", "DOMICILIO:", "DIRECCIÓN:"]
    then: rest_of_line
    comment: >
      Full address line after label.

  - rule_id: street_name_sn
    layer: regex_checksum
    phi_type: LOCATION_STREET
    pattern: '\b[A-ZÁÉÍÓÚÑÜ][a-záéíóúñü]+(?:\s+(?:de\s+(?:la|las|los|el)\s+)?[A-ZÁÉÍÓÚÑÜ][a-záéíóúñü]+)*,?\s+s/n\b'
    comment: >
      Street name followed by s/n (sin numero).

  - rule_id: street_ctra_km
    layer: regex_checksum
    phi_type: LOCATION_STREET
    pattern: '\b(?:Ctra\.|Carretera)\s+[A-Za-záéíóúñü\s-]+(?:Km|km)\s*\d+(?:[,\.]\d+)?\b'
    comment: >
      Highway address with Ctra and Km marker.

  - rule_id: postal_code
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\b(?:0[1-9]|[1-4]\d|5[0-2])\d{3}\b'
    comment: >
      Spanish postal code 01000-52999.

  - rule_id: localidad_label
    layer: context_cue
    phi_type: LOCATION_AREA
    cue: ["Localidad/ Provincia:", "Localidad:", "Provincia:", "LOCALIDAD:"]
    then: capitalised_words
    gap: 2
    comment: >
      Locality or province after label.

  - rule_id: location_area_name
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\b(?:0[1-9]|[1-4]\d|5[0-2])\d{3}[\s,]+([A-ZÁÉÍÓÚÑÜ][a-záéíóúñü]+(?:[\s,]+(?:de|del|la|las|los|el)?\s*[A-ZÁÉÍÓÚÑÜ][a-záéíóúñü]+)*)'
    comment: >
      Location name following Spanish postal code.

  - rule_id: location_province_parens
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\((?:Madrid|Barcelona|Valencia|Sevilla|Zaragoza|Málaga|Murcia|Palma|Las Palmas|Bilbao|Alicante|Córdoba|Valladolid|Vigo|Gijón|Granada|Oviedo|Santander|Burgos|Almería|Pontevedra|Cádiz|Huelva|Toledo|Segovia|Tarragona|Lleida|Girona|Castellón|Badajoz|Cáceres|Navarra|La Rioja|Cantabria|Asturias|Galicia|Aragón|Cataluña|Andalucía|España|Uruguay|Chile|México|CDMX|Mali)[)\.]'
    flags: [ignorecase]
    comment: >
      Province or country name in parentheses.

  - rule_id: location_cp_label
    layer: context_cue
    phi_type: LOCATION_AREA
    cue: ["CP:"]
    then: digits
    gap: 1
    comment: >
      Postal code after CP label.

  - rule_id: pais_label
    layer: context_cue
    phi_type: LOCATION_AREA
    cue: ["País:", "País de nacimiento:"]
    then: capitalised_words
    gap: 1
    comment: >
      Country after Pais label.

  - rule_id: ciudad_de_location
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\bCiudad de [A-ZÁÉÍÓÚÑÜ][a-záéíóúñü]+(?:\s+[A-ZÁÉÍÓÚÑÜ]+)?\b'
    comment: >
      Location starting with Ciudad de.

  - rule_id: age_number_suffix
    layer: regex_checksum
    phi_type: AGE
    pattern: '\b(\d{1,3})\s*años(?:\s+de\s+edad)?\b'
    flags: [ignorecase]
    comment: >
      Age as number followed by años.

  - rule_id: age_months
    layer: regex_checksum
    phi_type: AGE
    pattern: '\b(\d{1,2})\s*meses\s+de\s+edad\b'
    flags: [ignorecase]
    comment: >
      Age in months only when followed by de edad.

  - rule_id: age_days_vida
    layer: regex_checksum
    phi_type: AGE
    pattern: '\b(\d{1,3})\s*días\s+de\s+vida\b'
    flags: [ignorecase]
    comment: >
      Age in days of life.

  - rule_id: edad_label
    layer: context_cue
    phi_type: AGE
    cue: ["Edad:"]
    then: digits
    gap: 2
    comment: >
      Age after Edad label.

  - rule_id: profession_cue
    layer: context_cue
    phi_type: PROFESSION
    cue: ["trabaja como", "profesión:", "de profesión", "oficio:", "ocupación:"]
    then: rest_of_line
    gap: 3
    comment: >
      Profession or occupation after explicit cue.

  - rule_id: profession_ama_casa
    layer: regex_checksum
    phi_type: PROFESSION
    pattern: '\bama de casa\b'
    flags: [ignorecase]
    comment: >
      Homemaker profession.

  - rule_id: profession_carpintero
    layer: regex_checksum
    phi_type: PROFESSION
    pattern: '\b(?:carpintero|electricista|fontanero|albañil|mecánico|agricultor|conductor|camionero|panadero|carnicero|pescador|minero|obrero)\b'
    flags: [ignorecase]
    comment: >
      Common manual trade professions.

  - rule_id: hospital_org_name
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Hospital"]
    then: capitalised_words
    gap: 1
    comment: >
      Hospital name after Hospital keyword.

  - rule_id: hospital_univ_name
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Hospital Universitario"]
    then: capitalised_words
    gap: 1
    comment: >
      University hospital name.

  - rule_id: hospital_general_name
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Hospital General"]
    then: capitalised_words
    gap: 1
    comment: >
      General hospital name.

  - rule_id: hospital_regional_name
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Hospital Regional Universitario"]
    then: capitalised_words
    gap: 1
    comment: >
      Regional university hospital name.

  - rule_id: complejo_hosp_name
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Complejo Hospitalario"]
    then: capitalised_words
    gap: 1
    comment: >
      Complex name after Complejo Hospitalario.

  - rule_id: centro_salud_name
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Centro de Salud"]
    then: capitalised_words
    gap: 1
    comment: >
      Health center name.

  - rule_id: instituto_medicina_legal
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Instituto de Medicina Legal"]
    then: capitalised_words
    gap: 2
    comment: >
      Legal medicine institute name.

  - rule_id: instituto_univ_name
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Instituto Universitario"]
    then: capitalised_words
    gap: 2
    comment: >
      University institute name.

  - rule_id: fundacion_name_cue
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Fundación"]
    then: capitalised_words
    gap: 1
    comment: >
      Foundation name after Fundación keyword.

  - rule_id: servicio_org_name
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Servicio de"]
    then: capitalised_words
    gap: 1
    comment: >
      Service department name.

  - rule_id: org_brand_parens
    layer: regex_checksum
    phi_type: ORGANISATION
    pattern: '\b[A-Z][A-Za-z]+®?\s*\([A-Z][A-Za-z\s]+(?:SL|S\.L\.|SA|S\.A\.)\)'
    comment: >
      Brand name with corporate suffix in parentheses.