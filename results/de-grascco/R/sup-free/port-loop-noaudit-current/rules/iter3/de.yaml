version: 3
lang: de
rules:
  - rule_id: dr_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Dr.", "Dr "]
    then: capitalised_words

  - rule_id: prof_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Prof.", "Prof "]
    then: capitalised_words

  - rule_id: herr_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Herr ", "Herrn "]
    then: capitalised_words
    gap: 5

  - rule_id: frau_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Frau "]
    then: capitalised_words
    gap: 5

  - rule_id: patient_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Patient:", "Patientin:", "Patient ", "Patientin "]
    then: capitalised_words

  - rule_id: chefarzt_suffix
    layer: regex_checksum
    phi_type: NAME
    pattern: '\b[A-ZÄÖÜ][a-zäöüß]+(?:\s+[A-ZÄÖÜ][a-zäöüß]+)*\s*\(Chefarzt\)'

  - rule_id: oberarzt_suffix
    layer: regex_checksum
    phi_type: NAME
    pattern: '\b[A-ZÄÖÜ][a-zäöüß]+(?:\s+[A-ZÄÖÜ][a-zäöüß]+)*\s*\(Oberärztin\)'

  - rule_id: assistenzarzt_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Assistenzarzt ", "Assistenzärztin ", "Assistenzarzt:", "Assistenzärztin:"]
    then: capitalised_words

  - rule_id: stationsarzt_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Stationsarzt)", "Stationsarzt ", "Stationsärztin ", "Stationsarzt:", "Stationsärztin:"]
    then: capitalised_words

  - rule_id: priv_doz_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Priv.-Doz.", "Priv.Doz.", "PD ", "PD.", "Priv.Doz. "]
    then: capitalised_words

  - rule_id: univ_prof_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Univ.-Prof.", "Univ.Prof."]
    then: capitalised_words

  - rule_id: med_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["med.", "med "]
    then: capitalised_words

  - rule_id: drin_prefix
    layer: context_cue
    phi_type: NAME
    cue: ["Dr.in "]
    then: capitalised_words

  - rule_id: geschrieben_cue
    layer: context_cue
    phi_type: NAME
    cue: ["Geschrieben von "]
    then: capitalised_words

  - rule_id: mit_gruessen_name
    layer: regex_checksum
    phi_type: NAME
    pattern: '(?:Mit freundlichen(?:\s+kollegialen)?\s+Grüßen\s+)([A-ZÄÖÜ][a-zäöüß]+(?:\s+[A-ZÄÖÜ][a-zäöüß]+){1,4})'

  - rule_id: firstname_in_text
    layer: regex_checksum
    phi_type: NAME
    pattern: '\b(?:dass|wenn|ob|weil|da)\s+([A-ZÄÖÜ][a-zäöüß]+)\s+(?:würde|habe|sei|hätte|könne|müsse|solle)'

  - rule_id: geboren_date
    layer: context_cue
    phi_type: DATE
    cue: ["geboren am", "geb.", "geb ", "*", "Geburtsdatum:", "Geburtsdatum "]
    then: digits

  - rule_id: date_iso
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{4}-\d{2}-\d{2}\b'

  - rule_id: date_dot_dmy
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{1,2}\.\d{1,2}\.\d{2,4}\b'

  - rule_id: date_slash_dmy
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{1,2}/\d{1,2}/\d{2,4}\b'

  - rule_id: date_month_year
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b(?:0[1-9]|1[0-2])/\d{4}\b'

  - rule_id: date_spaced_dmy
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{1,2}\.\s+\d{1,2}\.\s*\d{4}\b'

  - rule_id: date_text_month
    layer: regex_checksum
    phi_type: DATE
    pattern: '\b\d{1,2}\.\s*(?:Jan(?:uar)?|Feb(?:ruar)?|Mär(?:z)?|Apr(?:il)?|Mai|Jun(?:i)?|Jul(?:i)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Okt(?:ober)?|Nov(?:ember)?|Dez(?:ember)?)\b'
    flags: [ignorecase]

  - rule_id: vom_bis_date
    layer: context_cue
    phi_type: DATE
    cue: ["vom ", "bis ", "bis zum "]
    then: digits

  - rule_id: phone_number
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b(?:\+49|0049|0)\s*\d{2,5}[\s\-/]?\d{3,8}\b'

  - rule_id: phone_austrian
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\+43\s*\(?\d?\)?\s*\d{3}[\s\-]?\d{3,4}[\s\-]?\d{0,6}'

  - rule_id: phone_swiss
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b(?:\+41|0041|0)\s*\d{2}[\s\-/]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}\b'

  - rule_id: email_address
    layer: regex_checksum
    phi_type: CONTACT
    pattern: '\b[\w.+-]+@[\w.-]+\.[a-zA-Z]{2,}\b'
    flags: [ignorecase]

  - rule_id: tel_cue
    layer: context_cue
    phi_type: CONTACT
    cue: ["Tel.:", "Tel:", "Telefon:", "Fax:", "Handy:", "Handy ", "Tel.: "]
    then: digits

  - rule_id: street_address
    layer: regex_checksum
    phi_type: LOCATION_STREET
    pattern: '\b[A-ZÄÖÜ][a-zäöüß]+(?:[-\s][A-ZÄÖÜ][a-zäöüß]+)*[-\s]?(?:Straße|Str\.|Strasse|straße|strasse|Weg|Platz|Allee|Gasse|Damm|Ring|Ufer|Chaussee)\s+\d+[a-zA-Z]?\b'
    flags: [ignorecase]

  - rule_id: street_number_first
    layer: regex_checksum
    phi_type: LOCATION_STREET
    pattern: '\b[A-ZÄÖÜ][a-zäöüß]+(?:[-\s][A-ZÄÖÜ][a-zäöüß]+)*\s+\d+[a-zA-Z]?\b(?=\s*[,\n]?\s*\d{4,5})'

  - rule_id: wohnhaft_cue
    layer: context_cue
    phi_type: LOCATION_STREET
    cue: ["wohnhaft "]
    then: rest_of_line

  - rule_id: postcode_city
    layer: regex_checksum
    phi_type: LOCATION_AREA
    pattern: '\b[AD]?-?\d{4,5}\s+[A-ZÄÖÜ][a-zäöüß]+(?:[-\s][A-ZÄÖÜ][a-zäöüß]+)*\b'

  - rule_id: universitaetsklinik_place
    layer: regex_checksum
    phi_type: ORGANISATION
    pattern: '\bUniversitätsklinik\s+[A-ZÄÖÜ][a-zäöüß]+\b'

  - rule_id: praxis_name
    layer: context_cue
    phi_type: ORGANISATION
    cue: ["Praxis "]
    then: capitalised_words

  - rule_id: versichertennummer
    layer: regex_checksum
    phi_type: ID
    pattern: '\b[A-Z]\d{9}\b'

  - rule_id: fallnummer_cue
    layer: context_cue
    phi_type: ID
    cue: ["Fallnummer:", "Fall-Nr.:", "Fall-Nr.", "Fallnr.:", "Fallnr.", "Aktenzeichen:", "Fallzahl:"]
    then: number

  - rule_id: patientennummer_cue
    layer: context_cue
    phi_type: ID
    cue: ["Patientennummer:", "Pat.-Nr.:", "Pat.-Nr.", "Pat.Nr.:", "Pat.Nr."]
    then: number

  - rule_id: sv_number
    layer: context_cue
    phi_type: ID
    cue: ["SV:", "SV: "]
    then: number

  - rule_id: station_id
    layer: regex_checksum
    phi_type: ID
    pattern: '\b(?:Station|Intensivstation)\s+[A-Z][-]?\d{1,2}\b'

  - rule_id: age_years
    layer: regex_checksum
    phi_type: AGE
    pattern: '\b\d{1,3}\s*[-–]?\s*(?:Jahre|J\.|jährig|jähriger|jährige|jähriges|jähr)\b'
    flags: [ignorecase]

  - rule_id: age_cue
    layer: context_cue
    phi_type: AGE
    cue: ["Alter:", "Alter ", "im Alter von"]
    then: number

  - rule_id: beruf_cue
    layer: context_cue
    phi_type: PROFESSION
    cue: ["Beruf:", "beruflich:", "von Beruf", "arbeitet als"]
    then: capitalised_words